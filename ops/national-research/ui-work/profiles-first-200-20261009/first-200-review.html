</style><header><small>ISITUSA / EDITORIAL REVIEW</small><h1>The first 200 species.</h1><p>Four alphabetical batches, with source links beside every description. Read through a batch or search for a species. Profile writing is separate from county evidence: inclusion here does not mean a species is invasive everywhere.</p><nav aria-label="Filter by batch"><button data-batch="0" aria-pressed="true">All 200</button><button data-batch="1" aria-pressed="false">1-50</button><button data-batch="2" aria-pressed="false">51-100</button><button data-batch="3" aria-pressed="false">101-150</button><button data-batch="4" aria-pressed="false">151-200</button></nav><label for="search">Find a species</label><input id="search" type="search" placeholder="Common or scientific name"><p id="count" role="status"></p></header><main id="profiles"></main><script>
const data=[{"id":"artemisia-absinthium","commonName":"Absinthium","scientificName":"Artemisia absinthium","batch":1,"order":1,"summary":"Wormwood's silvery, finely divided leaves give this perennial a soft appearance, while its strong scent is another useful clue. Lower leaves are larger and more divided than those near the tips of its branching stems. Originally from Eurasia, it is now naturalized across northern North America, including open fields and roadsides in South Dakota.","reviewedAt":"2026-10-09","sources":[{"label":"South Dakota State University","url":"https://openprairie.sdstate.edu/nativeplant/203/"}]},{"id":"launaea-intybacea","commonName":"Achicoria azul","scientificName":"Launaea intybacea","batch":1,"order":2,"summary":"Despite the name achicoria azul, this plant has pale yellow flowers. Slender, branching stems carry many small flower heads above toothed or lobed leaves, and ripe fruits have a tuft of white bristles. It grows in open, often disturbed places, including dry riverbeds, rocky ground and cultivated land. The flower color is a helpful starting point when comparing it with blue-flowered chicories.","reviewedAt":"2026-10-09","sources":[{"label":"Kew · Plants of the World Online","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:229022-1/general-information"}]},{"id":"convoluta-convoluta","commonName":"Acoellous turbellarian flatworm","scientificName":"Convoluta convoluta","batch":1,"order":3,"summary":"A flatworm only about 2-3 millimeters long, found on algae and other shallow-water surfaces. Researchers studied its feeding on newly settled mussels in the Gulf of Maine; those findings describe that study, not every coastline.","reviewedAt":"2026-09-28","sources":[{"label":"Byrnes & Witman · Gulf of Maine study","url":"https://byrneslab.net/pdfs/Byrnes_and_Witman_2003_JEMBE.pdf"}]},{"id":"eulachnus-rileyi","commonName":"Active gray pine needle aphid","scientificName":"Eulachnus rileyi","batch":1,"order":4,"summary":"This slender aphid feeds on pine needles. A dusting of bluish-gray wax can conceal an olive or orange-brown body, so color alone is not enough to distinguish it from other pine aphids.","reviewedAt":"2026-09-28","sources":[{"label":"Iowa State University · BugGuide","url":"https://www.bugguide.net/node/view/484519"}]},{"id":"kilifia-acuminata","commonName":"Acuminate scale","scientificName":"Kilifia acuminata","batch":1,"order":5,"summary":"A soft scale insect associated with mango and other host plants. It belongs to the group of sap-feeding insects that can be overlooked on foliage; a close examination is needed to separate it from other mango scales.","reviewedAt":"2026-09-28","sources":[{"label":"University of Florida · Mango pests","url":"https://ask.ifas.ufl.edu/publication/IG073"}]},{"id":"pineus-boerneri","commonName":"Adelgid","scientificName":"Pineus boerneri","batch":1,"order":6,"summary":"Small reddish-brown insects shelter under woolly, gray-white wax on pine twigs. The wax is often easier to notice than the adelgids themselves; related pine adelgids can look very similar.","reviewedAt":"2026-09-28","sources":[{"label":"Blackman & Eastop · Aphids on the World’s Plants","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_P/"}]},{"id":"erysimum-cheiri","commonName":"Aegean wallflower","scientificName":"Erysimum cheiri","batch":1,"order":7,"summary":"A familiar garden wallflower with clusters of yellow or orange blooms, though cultivated varieties come in other colors. It can grow in rocky crevices and walls where the soil drains freely.","reviewedAt":"2026-09-28","sources":[{"label":"NC State Extension · Wallflower","url":"https://plants.ces.ncsu.edu/plants/erysimum-x-cheiri/"}]},{"id":"amaranthus-muricatus","commonName":"African amaranth","scientificName":"Amaranthus muricatus","batch":1,"order":8,"summary":"A low-growing amaranth with narrow leaves, dense green flower clusters and tiny, wrinkled fruits. Its common name is misleading: this plant originated in South America, not Africa.","reviewedAt":"2026-09-28","sources":[{"label":"Flora of Israel · Botanical description","url":"https://flora.org.il/en/plants/amamur/"}]},{"id":"asparagus-asparagoides","commonName":"African asparagus fern","scientificName":"Asparagus asparagoides","batch":1,"order":9,"summary":"Bridal creeper scrambles over nearby plants with wiry stems, glossy oval leaf-like shoots and berries that ripen red. Its delicate-looking growth hides a substantial network of roots and tubers underground. In invaded Australian habitats, both the climbing stems and dense root mats crowd out other vegetation. Birds can carry seeds in the fruit, while discarded roots or contaminated soil can start new patches.","reviewedAt":"2026-10-09","sources":[{"label":"NSW Government · Bridal creeper","url":"https://weeds.dpi.nsw.gov.au/Weed/BridalCreeper"}]},{"id":"cynodon-nlemfuensis","commonName":"African bermudagrass","scientificName":"Cynodon nlemfuensis","batch":1,"order":10,"summary":"This star grass spreads along the ground on long runners, forming a dense mat. Unlike common bermudagrass, it lacks underground rhizomes. Its finger-like flower spikes are a useful clue, but closely related grasses need careful comparison.","reviewedAt":"2026-09-28","sources":[{"label":"Tropical Forages · Cynodon","url":"https://tropicalforages.info/text/entities/cynodon_spp.htm"}]},{"id":"sarotherodon-melanotheron","commonName":"African blackchin tilapia","scientificName":"Sarotherodon melanotheron","batch":1,"order":11,"summary":"A tilapia adapted to estuaries and brackish lagoons. In Florida, records also come from canals and drainage ditches. Males shelter developing eggs in their mouths, a distinctive part of this fish’s breeding behavior.","reviewedAt":"2026-09-28","sources":[{"label":"USGS · Blackchin tilapia","url":"https://nas.er.usgs.gov/queries/FactSheet.aspx?SpeciesID=477"}]},{"id":"sansevieria-cylindrica","commonName":"African bowstring hemp","scientificName":"Sansevieria cylindrica","batch":1,"order":12,"summary":"Often sold as a cylindrical snake plant, this succulent grows stiff, rounded leaves from a basal rosette. You may also find it named Dracaena angolensis; that name refers to the same plant in the linked botanical reference.","reviewedAt":"2026-09-28","sources":[{"label":"NC State Extension · African spear","url":"https://plants.ces.ncsu.edu/plants/dracaena-angolensis/"}]},{"id":"lycium-ferocissimum","commonName":"African boxthorn","scientificName":"Lycium ferocissimum","batch":1,"order":13,"summary":"A woody shrub armed with long thorns, small fleshy leaves and orange-red berries. It can form dense thickets. Photograph its leaves, flowers and branching pattern from a safe distance; the thorns make close handling difficult.","reviewedAt":"2026-09-28","sources":[{"label":"NSW Government · African boxthorn","url":"https://weeds.dpi.nsw.gov.au/Weed/AfricanBoxthorn"}]},{"id":"setaria-sphacelata","commonName":"African bristlegrass","scientificName":"Setaria sphacelata","batch":1,"order":14,"summary":"A perennial grass that grows in dense clumps, sometimes reaching two meters. Its long, bristly flower spikes and broad grass blades help narrow an identification, but several other Setaria grasses have a similar outline.","reviewedAt":"2026-09-28","sources":[{"label":"Royal Botanic Gardens Sydney · PlantNET","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Setaria~sphacelata&page=nswfl"}]},{"id":"xenopus-laevis","commonName":"African clawed frog","scientificName":"Xenopus laevis","batch":1,"order":15,"summary":"An aquatic frog with a flattened body, eyes on top of its head and fully webbed hind feet. Three toes on each hind foot carry dark claws. Its front fingers are unwebbed, unlike its broad swimming feet.","reviewedAt":"2026-09-28","sources":[{"label":"USGS · African clawed frog","url":"https://nas.er.usgs.gov/queries/FactSheet.aspx?SpeciesID=67"}]},{"id":"chasmanthe-floribunda","commonName":"African cornflag","scientificName":"Chasmanthe floribunda","batch":1,"order":16,"summary":"Sword-shaped leaves rise beneath tall, branching spikes of orange flowers. This South African plant grows from an underground corm and is easily confused with Crocosmia, so the shape and arrangement of its flowers matter.","reviewedAt":"2026-09-28","sources":[{"label":"SANBI · PlantZAfrica","url":"https://pza.sanbi.org/chasmanthe-floribunda"}]},{"id":"cenchrus-macrourus","commonName":"African feathergrass","scientificName":"Cenchrus macrourus","batch":1,"order":17,"summary":"Tall clumps carry long, narrow flower spikes surrounded by fine bristles. This grass spreads through underground stems as well as seeds; moving soil or discarded garden material can move those stems to new places.","reviewedAt":"2026-09-28","sources":[{"label":"NSW Government · African feather grass","url":"https://weeds.dpi.nsw.gov.au/Weed/AfricanFeatherGrass"}]},{"id":"zaprionus-indianus","commonName":"African fig fly","scientificName":"Zaprionus indianus","batch":1,"order":18,"summary":"A small brown fruit fly with crisp white stripes edged in black along its head and back. Those stripes help distinguish it from many familiar vinegar flies; close-up photographs are more useful than a distant view.","reviewedAt":"2026-09-28","sources":[{"label":"Virginia Tech · African fig fly","url":"https://virginiafruit.ento.vt.edu/AFF.html"}]},{"id":"hemichromis-letourneuxi","commonName":"African Jewelfish","scientificName":"Hemichromis letourneuxi","batch":1,"order":19,"summary":"A small African cichlid found in fresh and brackish water. Its identification has a complicated history: older Florida records often used the name Hemichromis bimaculatus, making the source and scientific name especially important.","reviewedAt":"2026-09-28","sources":[{"label":"USGS · African jewelfish","url":"https://nas.er.usgs.gov/queries/factsheet.aspx?SpeciesID=457"}]},{"id":"hemarthria-altissima","commonName":"African jointgrass","scientificName":"Hemarthria altissima","batch":1,"order":20,"summary":"Also known as limpograss, this perennial is grown as forage on wet, poorly drained ground in Florida. It keeps growing into cooler parts of the season when many other warm-season pasture grasses slow down.","reviewedAt":"2026-09-28","sources":[{"label":"University of Florida · Limpograss","url":"https://ask.ifas.ufl.edu/publication/AG330"}]},{"id":"strigosella-africana","commonName":"African mustard","scientificName":"Strigosella africana","batch":1,"order":21,"summary":"A small annual mustard with pink to violet flowers and long, slender seed pods. Its hairy stems often branch close to the ground. Look for the combination of flowers and pods when comparing it with other roadside mustards.","reviewedAt":"2026-09-28","sources":[{"label":"Intermountain Herbaria · Botanical description","url":"https://intermountainbiota.org/portal/taxa/index.php?taxon=1205"}]},{"id":"elaeis-guineensis","commonName":"African oil palm","scientificName":"Elaeis guineensis","batch":1,"order":22,"summary":"A large palm with arching fronds and tightly packed bunches of oily fruits. Young trunks retain the bases of old leaves. Native to tropical Africa, it is the species cultivated widely for palm oil.","reviewedAt":"2026-09-28","sources":[{"label":"Kew · Plants of the World Online","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:666802-1/general-information"}]},{"id":"olea-europaea-ssp-cuspidata","commonName":"African olive","scientificName":"Olea europaea ssp. cuspidata","batch":1,"order":23,"summary":"An evergreen olive with a dense crown and small fruits that turn purple-black. Its leaves are green to yellow-brown underneath, unlike the silvery underside of common cultivated olives. Birds can disperse its seeds.","reviewedAt":"2026-09-28","sources":[{"label":"NSW Government · African olive","url":"https://weeds.dpi.nsw.gov.au/Weed/AfricanOlive"}]},{"id":"lepidium-africanum","commonName":"African pepperwort","scientificName":"Lepidium africanum","batch":1,"order":24,"summary":"A pepperwort with tiny flowers and rows of small, flattened seed pods. The lower leaves are often toothed or divided, while leaves higher on the stem become narrower. Mature pods help distinguish it from other pepperweeds.","reviewedAt":"2026-09-28","sources":[{"label":"Royal Botanic Gardens Sydney · PlantNET","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Lepidium~africanum&page=nswfl"}]},{"id":"python-sebae","commonName":"African rock python","scientificName":"Python sebae","batch":1,"order":25,"summary":"A large, nonvenomous constrictor introduced to southern Florida. African rock pythons can resemble Burmese pythons, so a photograph and expert identification are more useful than a guess from size alone. Keep your distance from any large unfamiliar snake.","reviewedAt":"2026-10-09","sources":[{"label":"Florida Museum · African rock python","url":"https://www.floridamuseum.ufl.edu/florida-snake-id/snake/african-rock-python/"}]},{"id":"senna-didymobotrya","commonName":"African senna","scientificName":"Senna didymobotrya","batch":1,"order":26,"summary":"Often sold as popcorn cassia, this African shrub gets its nickname from the scent of its rubbed foliage. It grows quickly and can become a small tree in warm climates, while gardeners in colder regions often grow it as a seasonal ornamental.","reviewedAt":"2026-10-09","sources":[{"label":"University of Wisconsin Extension","url":"https://hort.extension.wisc.edu/articles/popcorn-cassia-senna-cassia-didymobotrya/"}]},{"id":"tamarix-africana","commonName":"African tamarisk","scientificName":"Tamarix africana","batch":1,"order":27,"summary":"This tamarisk carries exceptionally small leaves: individual blades are only about 1.5-2.5 millimeters long. Identifying a tamarisk to species takes more than its feathery appearance; retain close photographs of leaves and flowers for comparison with a botanical key.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of North America","url":"https://efloras.org/florataxon.aspx?flora_id=1&taxon_id=250101263"}]},{"id":"spathodea-campanulata","commonName":"African tuliptree","scientificName":"Spathodea campanulata","batch":1,"order":28,"summary":"Large orange-red flowers with crinkled yellow edges make African tulip trees easy to notice. Long capsules split to release light, winged seeds, and damaged trees can produce root suckers. In tropical and subtropical regions it can spread beyond planted landscapes into wetter disturbed habitats.","reviewedAt":"2026-10-09","sources":[{"label":"Environmental Weeds of Australia · Botanical key","url":"https://keyserver.lucidcentral.org/weeds/data/03080008-0301-4c05-8c0e-0c0f040b0803/media/Html/spathodea_campanulata.htm"}]},{"id":"phacochoerus-africanus","commonName":"African warthog","scientificName":"Phacochoerus africanus","batch":1,"order":29,"summary":"A broad head, curved tusks and a bristly mane give the common warthog its familiar outline. This African grassland animal often lowers itself onto padded wrist joints to crop short grass, then uses its snout and tusks to dig for bulbs and roots. Mud wallows help it cool down, and burrows provide shelter at night. Females and young commonly live in family groups.","reviewedAt":"2026-10-09","sources":[{"label":"University of Michigan · Animal Diversity Web","url":"https://animaldiversity.org/accounts/Phacochoerus_africanus/"}]},{"id":"dioscorea-bulbifera","commonName":"Air yam","scientificName":"Dioscorea bulbifera","batch":1,"order":30,"summary":"Air potato is a climbing vine with broad, heart-shaped leaves and potato-like bulbils held above ground along its stems. Those bulbils are a useful recognition clue. In Florida, vines can climb into tree canopies, so look up as well as along fences and woodland edges.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida · Air potato","url":"https://plant-directory.ifas.ufl.edu/plant-directory/dioscorea-bulbifera/"}]},{"id":"melampsoridium-hiratsukanum","commonName":"Alder rust","scientificName":"Melampsoridium hiratsukanum","batch":1,"order":31,"summary":"Alder rust can leave orange-yellow pustules beneath alder leaves, with yellow or orange spots above. Leaves may curl, brown or fall early. Several alder rust fungi look alike, so these symptoms justify closer examination rather than a species-level diagnosis from a photograph.","reviewedAt":"2026-10-09","sources":[{"label":"California Department of Food and Agriculture","url":"https://blogs.cdfa.ca.gov/Section3162/?p=1226"}]},{"id":"pinus-halepensis","commonName":"Aleppo pine","scientificName":"Pinus halepensis","batch":1,"order":32,"summary":"Aleppo pine starts with a relatively narrow crown that becomes rounded or umbrella-shaped as it ages. Its thin, light-green needles usually grow in pairs, and cones can stay on the branches for several years. Native to the Mediterranean and widely planted in California and the Southwest, it tolerates poor soil, heat and coastal conditions. A twisted trunk and irregular branching add to its distinctive silhouette.","reviewedAt":"2026-10-09","sources":[{"label":"Oregon State University · Landscape Plants","url":"https://landscapeplants.oregonstate.edu/plants/pinus-halepensis"}]},{"id":"ptychosperma-elegans","commonName":"Alexander palm","scientificName":"Ptychosperma elegans","batch":1,"order":33,"summary":"Also called solitaire palm, this Australian palm has a single slim, pale trunk marked with rings. Look for jagged, squared-off leaflet tips, a smooth green crownshaft and bright red fruit. Despite the common name Alexander palm, the scientific name matters when comparing it with other ornamental palms.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida · Solitaire palm","url":"https://ask.ifas.ufl.edu/publication/FR313"}]},{"id":"calophyllum-inophyllum","commonName":"Alexandrian laurel","scientificName":"Calophyllum inophyllum","batch":1,"order":34,"summary":"Look closely at a beauty leaf tree and you will see many fine, parallel veins running across its glossy oval leaves. Fragrant white flowers give way to round fruits, each containing a seed surrounded by a buoyant layer. That packaging helps the fruits travel on water. Also called tamanu, this tropical tree grows along sandy and rocky shores and is planted for shade.","reviewedAt":"2026-10-09","sources":[{"label":"Singapore National Parks · Flora & Fauna Web","url":"https://www.nparks.gov.sg/florafaunaweb/flora/2/7/2774"},{"label":"National Tropical Botanical Garden","url":"https://www.ntbg.org/database/plants/detail/calophyllum-inophyllum"}]},{"id":"medicago-sativa","commonName":"Alfalfa","scientificName":"Medicago sativa","batch":1,"order":35,"summary":"Alfalfa is the familiar perennial legume grown for hay and livestock feed. Its leaves have three leaflets, and clusters of small, pea-shaped flowers are usually bluish purple, though other colors occur. The developing pods curl into tight spirals, a useful detail when flowers are gone. Plants can also occur along roadsides and field edges, so note whether a patch is cultivated or growing on its own.","reviewedAt":"2026-10-09","sources":[{"label":"University of Minnesota Extension · Forage legumes","url":"https://extension.umn.edu/agriculture/crop-production/forages/forage-legumes"},{"label":"University of Minnesota Extension · Alfalfa flowers","url":"https://blog-crop-news.extension.umn.edu/2024/10/the-beauty-of-alfalfa.html"},{"label":"University of British Columbia - E-Flora BC","url":"https://linnet.geog.ubc.ca/Atlas/Atlas.aspx?noTransfer=1&sciname=Medicago+sativa"}]},{"id":"medicago-sativa-ssp-sativa","commonName":"Alfalfa","scientificName":"Medicago sativa ssp. sativa","batch":1,"order":36,"summary":"This is the purple- or blue-flowered subspecies of alfalfa, the forage plant also called lucerne. Like other alfalfa, it has three-part leaves and compact clusters of pea-shaped flowers; its pods form little coils as they develop. Those flower and fruit details help separate it from yellow-flowered relatives. This entry preserves the subspecies distinction, rather than treating every alfalfa observation as equally precise.","reviewedAt":"2026-10-09","sources":[{"label":"University of British Columbia - E-Flora BC","url":"https://linnet.geog.ubc.ca/Atlas/Atlas.aspx?noTransfer=1&sciname=Medicago+sativa"}]},{"id":"gracilaria-vermiculophylla","commonName":"Algae","scientificName":"Gracilaria vermiculophylla","batch":1,"order":37,"summary":"This branching red seaweed can form bushy tangles of narrow, cylindrical strands. Its color ranges from reddish brown to greenish or nearly black, making color an unreliable shortcut. Closely related seaweeds look similar; reliable identification can require microscopy or genetic analysis.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian Environmental Research Center · NEMESIS","url":"https://invasions.si.edu/nemesis/species_summary/-328"}]},{"id":"grateloupia-doryphora","commonName":"Algae","scientificName":"Grateloupia doryphora","batch":1,"order":38,"summary":"Use this name carefully when reading older seaweed records. Large red algae introduced to Europe and New England were once called Grateloupia doryphora, but genetic work identified them as G. turuturu. A historical label should therefore be checked before transferring its distribution or impacts to this species.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian Environmental Research Center · Identification history","url":"https://invasions.si.edu/nemesis/species_summary/12572"}]},{"id":"limonium-ramosissimum","commonName":"Algerian sea lavender","scientificName":"Limonium ramosissimum","batch":1,"order":39,"summary":"Algerian sea lavender is a management concern in San Francisco Bay tidal marshes. It is easily confused with European sea lavender, so photographs alone may not settle an identification. The distinction matters when recording a patch, comparing older surveys or planning work around sensitive marsh habitat.","reviewedAt":"2026-10-09","sources":[{"label":"California Invasive Plant Council · Sea lavender research","url":"https://www.cal-ipc.org/project/sea-lavender-sf-bay/"},{"label":"Cal-IPC · Similar-species caution","url":"https://www.cal-ipc.org/plants/paf/limonium-duriusculum-plant-assessment-form/"}]},{"id":"alternanthera-philoxeroides","commonName":"Alligatorweed","scientificName":"Alternanthera philoxeroides","batch":1,"order":40,"summary":"Alligatorweed spreads across water and wet banks on sprawling stems. Look for opposite leaves and small, white, papery flower heads held on stalks; aquatic stems are often hollow. Stem fragments can root, which is why broken pieces deserve attention when cleaning equipment or moving plant material.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida · Alligatorweed","url":"https://plant-directory.ifas.ufl.edu/plant-directory/alternanthera-philoxeroides/"},{"label":"University of Florida IFAS · Weed management","url":"https://ipm.ifas.ufl.edu/pdfs/Chapter6-Weed_Mgmt.pdf"}]},{"id":"phytomyza-gymnostoma","commonName":"Allium leafminer","scientificName":"Phytomyza gymnostoma","batch":1,"order":41,"summary":"Rows of tiny white punctures on onion, leek or garlic leaves are an early clue to allium leafminer activity. Adult females make the marks, while larvae feed inside the plant. Photograph both the damaged leaf and the whole crop before seeking confirmation, since not every damaged onion has this pest.","reviewedAt":"2026-10-09","sources":[{"label":"Penn State Extension · Allium leafminer","url":"https://extension.psu.edu/fall-flight-of-allium-leafminer-observed-in-southeast-pa"}]},{"id":"pimenta-dioica","commonName":"Allspice","scientificName":"Pimenta dioica","batch":1,"order":42,"summary":"The allspice in a kitchen spice jar comes from the dried, unripe fruits of this tree, not a blend of several spices. The living plant is a tropical evergreen with aromatic leaves, smooth gray bark and clusters of small white flowers. Its berries turn from green to purple as they ripen. Native to southern Mexico, Central America and the Caribbean, it is especially associated with cultivation in Jamaica.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens, Kew - Species profile","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:196799-2/general-information"}]},{"id":"cadra-cautella","commonName":"Almond moth","scientificName":"Cadra cautella","batch":1,"order":43,"summary":"Almond moth is a stored-food pest whose larvae can infest bagged grain and the surface of bulk grain stores. The name is narrower than its food supply: an infestation is not limited to almonds. When moths appear around stored food, identifying the infested product is as important as identifying the adult.","reviewedAt":"2026-10-09","sources":[{"label":"Canadian Grain Commission · Almond moth","url":"https://www.canada.ca/en/grain-commission/services/grain-quality/manage-stored-grain/identify-insect/secondary-insect-pests/almond-moth.html"}]},{"id":"aloephagus-myersi","commonName":"Aloe aphid","scientificName":"Aloephagus myersi","batch":1,"order":44,"summary":"Tiny aloe aphids can hide beneath leaf bases, where their fluffy wax may be more visible than their bodies. Wingless adults are roughly 2 millimeters long and may be attended by ants. Inspect sheltered parts of an aloe rather than only its exposed leaf surfaces.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman & Eastop · Aphids on the World's Plants","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_A/"}]},{"id":"trifolium-hybridum","commonName":"Alsike clover","scientificName":"Trifolium hybridum","batch":1,"order":45,"summary":"Alsike clover has white-to-pink flower heads and smooth leaflets without the pale watermark often seen on other clovers. It favors moist ground and can reseed into pastures and roadsides. Despite its scientific name, it is a distinct species, not a hybrid of red and white clover.","reviewedAt":"2026-10-09","sources":[{"label":"University of Minnesota Extension · Forage legumes","url":"https://extension.umn.edu/agriculture/crop-production/forages/forage-legumes"}]},{"id":"alyssum-strigosum","commonName":"Alyssum","scientificName":"Alyssum strigosum","batch":1,"order":46,"summary":"An annual alyssum native from southern Europe toward Afghanistan. Its name needs particular care in North American records: Flora of North America notes that many reports were based on misidentified A. simplex. Check the specimen or original identification before treating an old record as confirmed.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of North America · Alyssum identification notes","url":"https://efloras.org/florataxon.aspx?flora_id=1&taxon_id=241000086"},{"label":"Royal Botanic Gardens, Kew","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:277808-1"}]},{"id":"aphis-amaranthi","commonName":"Amaranth aphid","scientificName":"Aphis amaranthi","batch":1,"order":47,"summary":"Amaranth aphids are small olive-green or reddish-brown insects associated with amaranths. Colonies can occur around roots and stem bases as well as leaves and flower clusters, and ants often attend them. A close look near the base of a plant may reveal insects missed by a quick leaf check.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman & Eastop · Aphids on the World's Plants","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_A/"}]},{"id":"pterygoplichthys-pardalis","commonName":"Amazon sailfin catfish","scientificName":"Pterygoplichthys pardalis","batch":1,"order":48,"summary":"An armored suckermouth catfish often called an Amazon sailfin catfish. Dark markings on its underside help distinguish it from related species, but the patterns can vary and should not be used alone. Several similar aquarium catfishes have been introduced outside their native range, making careful identification important.","reviewedAt":"2026-10-09","sources":[{"label":"US Army Corps of Engineers · Suckermouth catfishes","url":"https://ansrp.el.erdc.dren.mil/elpubs/pdf/ansrp-v14-1.pdf"}]},{"id":"cecropia-pachystachya","commonName":"Ambay pumpwood","scientificName":"Cecropia pachystachya","batch":1,"order":49,"summary":"Ambay pumpwood has large, deeply lobed leaves and a lightly branched crown that give it an umbrella-like outline. Native to tropical South America, it is a pioneer tree that takes advantage of open or disturbed ground. Its relationship with ants is especially interesting: hollow stems offer shelter, and specialized structures provide food. Similar Cecropia trees share much of this appearance, so a leaf silhouette alone will not settle the species.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens, Kew · Plants of the World Online","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:50908-2"},{"label":"National University of Singapore - Cecropia ecology","url":"https://lkcnhm.nus.edu.sg/wp-content/uploads/sites/11/app/uploads/2017/06/2010nis199-209.pdf"},{"label":"Reis and colleagues - Ant fauna on Cecropia pachystachya","url":"https://citeseerx.ist.psu.edu/document?doi=5ac39ae896c6435f15b9f39395ecc8a6291b6e5f&repid=rep1&type=pdf"}]},{"id":"anisandrus-maiche","commonName":"Ambrosia beetle","scientificName":"Anisandrus maiche","batch":1,"order":50,"summary":"This tiny ambrosia beetle makes its home inside wood, where it cultivates fungi that feed its young. North American records were first published in 2009 from Pennsylvania, Ohio and West Virginia. Research in central New York found that it spends winter as a mature larva inside its galleries. Small entry holes may draw attention to an affected tree, but identifying this beetle requires a closer look at the insect itself.","reviewedAt":"2026-10-09","sources":[{"label":"USDA Agricultural Research Service · First North American records","url":"https://www.ars.usda.gov/research/publications/publication/?seqNo115=235932"},{"label":"USDA ARS - Phenology and overwintering study","url":"https://www.ars.usda.gov/research/publications/publication/?seqNo115=417167"}]},{"id":"euwallacea-similis","commonName":"Ambrosia beetle","scientificName":"Euwallacea similis","batch":2,"order":51,"summary":"This slender, light-brown ambrosia beetle is a wood inhabitant with a broad range of host trees. Its narrow shape and the small bumps on the sloping rear of its wing covers help specialists separate it from similar beetles. Records often use the older name Xyleborus similis, so tracking those names matters when comparing reports of this introduced species.","reviewedAt":"2026-10-09","sources":[{"label":"Netherlands NPPO: Euwallacea similis risk scan","url":"https://english.nvwa.nl/binaries/nvwa-en/documenten/plant/plant-health/pest-risk-analysis/documents/quick-scan-euwallacea-similis/Quick%2Bscan-Euwallacea-similis-January-2022.pdf"},{"label":"University of Florida and US Forest Service: North American Xyleborini","url":"https://ambrosiasymbiosis.org/northamericanxyleborini/list.html"}]},{"id":"syngonium-podophyllum","commonName":"American evergreen","scientificName":"Syngonium podophyllum","batch":2,"order":52,"summary":"Familiar as an indoor arrowhead plant, American evergreen becomes a vigorous climbing vine in warm, shaded landscapes. Young leaves have the recognizable arrow shape, while established plants can spread across the ground and climb trees. In Florida natural areas, dense growth can suppress native vegetation and add weight to branches. Discarded garden material is one route by which this ornamental escapes cultivation.","reviewedAt":"2026-10-09","sources":[{"label":"UF/IFAS: Arrowhead vine","url":"https://plant-directory.ifas.ufl.edu/plant-directory/syngonium-podophyllum/"}]},{"id":"caprella-scaura","commonName":"Amphipod","scientificName":"Caprella scaura","batch":2,"order":53,"summary":"Caprella scaura is a small marine amphipod that grips seaweeds, branching animals, and submerged structures. Females brood their young, which initially cling to their mother. Dense introduced populations can crowd other small crustaceans. Its original home remains uncertain, and several similar forms have been grouped under this name, complicating the story of its worldwide spread.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Caprella scaura","url":"https://invasions.si.edu/nemesis/species_summary/95430"}]},{"id":"phellodendron-amurense","commonName":"Amur corktree","scientificName":"Phellodendron amurense","batch":2,"order":54,"summary":"Amur corktree takes its name from its soft, deeply furrowed bark. This spreading deciduous tree bears opposite leaves divided into several leaflets, with a strong resinous scent when crushed. Female trees produce clusters of small fruits that turn black. Introduced as a landscape tree from eastern Asia, it can seed beyond cultivation, and the University of Connecticut documents an invasive tendency in that state.","reviewedAt":"2026-10-09","sources":[{"label":"University of Connecticut Plant Database: Amur corktree","url":"https://plantdatabase.uconn.edu/detail.php?pid=305"}]},{"id":"rhinogobius-brunneus","commonName":"Amur goby","scientificName":"Rhinogobius brunneus","batch":2,"order":55,"summary":"The Amur goby is a small bottom-dwelling fish with joined pelvic fins that form a suction-cup-like disc. Breeding males can show striking red or blue colors and pale fin edges. USGS records fish under this name from the Columbia River region, but cautions that Rhinogobius brunneus has been used for a complex of similar species. That uncertainty matters when interpreting its life history and introduced range.","reviewedAt":"2026-10-09","sources":[{"label":"USGS Nonindigenous Aquatic Species: Amur goby","url":"https://nas.er.usgs.gov/queries/FactSheet.aspx?SpeciesID=2612"}]},{"id":"lonicera-maackii","commonName":"Amur Honeysuckle","scientificName":"Lonicera maackii","batch":2,"order":56,"summary":"Amur honeysuckle is a large deciduous shrub with opposite, pointed leaves and paired flowers that fade from white to yellow. Birds carry the seeds in its red fruits. Its early spring leaves and long autumn growing season help it form dense shade beneath woodland edges and trees. Across invaded parts of eastern North America, that thick understory can crowd out native plants.","reviewedAt":"2026-10-09","sources":[{"label":"NC State Extension: Amur honeysuckle","url":"https://plants.ces.ncsu.edu/plants/lonicera-maackii/"}]},{"id":"lernaea-cyprinacea","commonName":"Anchor worm","scientificName":"Lernaea cyprinacea","batch":2,"order":57,"summary":"Anchor worm is a tiny crustacean related to other copepods. After mating, the female embeds an anchor-shaped front end in a freshwater fish, leaving her elongated body and egg sacs outside. Carp and goldfish are frequent hosts, though many other fish can be affected. Attachment wounds and damage to gills make heavy infestations a concern, especially in warm, slow-moving water.","reviewedAt":"2026-10-09","sources":[{"label":"UF/IFAS: Lernaea infestations in fish","url":"https://edis.ifas.ufl.edu/publication/FA185/pdf"}]},{"id":"eichhornia-azurea","commonName":"Anchored water hyacinth","scientificName":"Eichhornia azurea","batch":2,"order":58,"summary":"Anchored water hyacinth is an aquatic perennial whose roots usually remain fixed in mud while its stems and leaves spread across the water. Showy blue-purple flowers rise above the leaves, and the leaf stalks lack the inflated floats familiar from common water hyacinth. It grows in warm, slow-moving rivers, lakes, and marshes. Its dense mats change aquatic habitat, although research on its impacts remains limited.","reviewedAt":"2026-10-09","sources":[{"label":"USGS Nonindigenous Aquatic Species: Anchored waterhyacinth","url":"https://nas.er.usgs.gov/queries/FactSheet.aspx?speciesID=2758"}]},{"id":"brugmansia-suaveolens","commonName":"Angel's tears","scientificName":"Brugmansia suaveolens","batch":2,"order":59,"summary":"Angel's tears is a woody South American plant known for its large, hanging trumpet flowers. Their evening fragrance attracts moths, linking the plant's daily rhythm to its nighttime pollinators. It is widely recognizable in cultivation, yet Cambridge University Botanic Garden describes the species as extinct in its native wild habitat. This poisonous ornamental has a very different conservation story from many familiar garden escapes.","reviewedAt":"2026-10-09","sources":[{"label":"Cambridge University Botanic Garden: Angel's trumpet","url":"https://www.botanic.cam.ac.uk/learning/trails/plant-rhythms/angels-trumpet/"},{"label":"Cambridge University Botanic Garden: Brugmansia suaveolens","url":"https://www.botanic.cam.ac.uk/the-garden/plant-list/brugmansia-suaveolens/"}]},{"id":"opuntia-microdasys","commonName":"Angel's-wings","scientificName":"Opuntia microdasys","batch":2,"order":60,"summary":"Angel's-wings, also called bunny ears cactus, forms branching clumps of flattened green pads dotted with tiny bristles. Those dots are clusters of barbed glochids that detach readily, even though the plant lacks the long spines of many cacti. Creamy-yellow flowers may be followed by reddish-purple fruits. Detached pads can root, helping explain how a small ornamental can expand into a spreading patch in suitable dry conditions.","reviewedAt":"2026-10-09","sources":[{"label":"NC State Extension: Opuntia microdasys","url":"https://plants.ces.ncsu.edu/plants/opuntia-microdasys/common-name/rabbit-cactus/"}]},{"id":"dichanthium-aristatum","commonName":"Angleton bluestem","scientificName":"Dichanthium aristatum","batch":2,"order":61,"summary":"Angleton bluestem is a perennial pasture grass with slender stems and a seed head made of several narrow branches. A patch of dense hairs just below the lowest branch is a useful identification clue. It tolerates seasonal flooding and waterlogged clay soils, and spreads by seed and creeping stems. Its ability to persist under heavy grazing can let it dominate less grazing-tolerant vegetation.","reviewedAt":"2026-10-09","sources":[{"label":"Tropical Forages: Dichanthium aristatum","url":"https://www.tropicalforages.info/text/entities/dichanthium_aristatum.htm"}]},{"id":"sitotroga-cerealella","commonName":"Angoumois grain moth","scientificName":"Sitotroga cerealella","batch":2,"order":62,"summary":"The Angoumois grain moth is a small, pale gray-brown moth whose caterpillars spend their development hidden inside grain kernels. Wheat, corn, rice, and other cereals can contain feeding damage before much is visible outside. Adults do not eat the grain, and infestations lack the conspicuous webbing made by some other storage moths. Hollowed kernels and nearby flying adults offer clues to its presence.","reviewedAt":"2026-10-09","sources":[{"label":"Canadian Grain Commission: Angoumois grain moth","url":"https://grainscanada.gc.ca/en/grain-quality/manage/identify-an-insect/primary-insect-pests/angoumois-grain-moth.html"}]},{"id":"cowpea-mild-mottle-virus","commonName":"Angular mosaic of beans","scientificName":"Cowpea mild mottle virus","batch":2,"order":63,"summary":"Cowpea mild mottle virus infects cowpea and several other crop and wild hosts. Leaves may develop pale patches, mottling, curling, or distortion, although the symptoms can be subtle. Whiteflies transmit the virus, and seed transmission has been reported in some hosts. Because similar-looking leaf symptoms have many possible causes, the crop name or appearance alone cannot establish which virus is present.","reviewedAt":"2026-10-09","sources":[{"label":"EFSA PERSEUS pest survey review via IPPC: Cowpea mild mottle virus","url":"https://www.ippc.int/static/media/files/publication/en/2015/09/13_EWG_ISPM6_2015_Sept_EFSA_PERSEUS_Appendix_C_to_the_Final_report.pdf"}]},{"id":"avena-sterilis","commonName":"Animated oat","scientificName":"Avena sterilis","batch":2,"order":64,"summary":"Animated oat is an annual wild oat of crop fields, roadsides, and disturbed ground. Its large florets usually fall in pairs and carry long, bent, twisting awns, useful clues when comparing it with common wild oat. It can travel as a contaminant of cereal seed and grain. A life cycle closely matching annual crops helps it persist in fields and makes separation at harvest difficult.","reviewedAt":"2026-10-09","sources":[{"label":"Canadian Food Inspection Agency: Avena sterilis identification","url":"https://inspection.canada.ca/en/plant-health/seeds/seed-testing-and-grading/seeds-identification/avena-sterilis?wbdisable=true"}]},{"id":"myrrhis-odorata","commonName":"Anise","scientificName":"Myrrhis odorata","batch":2,"order":65,"summary":"Sweet cicely is a perennial herb with finely divided, fernlike leaves and an anise-like scent. Pale green foliage appears early in spring, followed by umbrella-shaped clusters of small flowers. Native from the Pyrenees toward the Caucasus, it has a long history in gardens. The scientific name is useful here because the common name anise can point to quite different plants.","reviewedAt":"2026-10-09","sources":[{"label":"Dutch Association of Botanical Gardens: Sweet cicely","url":"https://www.botanischetuinen.nl/en/plant_en/915/sweet-cicely"}]},{"id":"rapistrum-rugosum","commonName":"Annual bastardcabbage","scientificName":"Rapistrum rugosum","batch":2,"order":66,"summary":"Annual bastardcabbage starts with a broad rosette of lobed leaves, then sends up branched stems carrying small yellow flowers. Its two-part, beaked fruits are a better identification clue than the flowers alone. It grows readily in roadsides, fields, and other disturbed places. In invaded Texas habitats, its large basal leaves and dense stands can leave little growing space for nearby native plants.","reviewedAt":"2026-10-09","sources":[{"label":"Texas Invasives: Bastard cabbage","url":"https://texasinvasives.org/plant_database/detail.php?symbol=RARU"}]},{"id":"poa-annua","commonName":"Annual Bluegrass","scientificName":"Poa annua","batch":2,"order":67,"summary":"Annual bluegrass is a small grass familiar in lawns, gardens, and golf courses. Look for pale green growth, boat-shaped leaf tips, and seed heads that can form even under close mowing. It grows best during cooler weather and can produce seed quickly. Some populations behave as perennials, so the everyday name does not capture the full range of its life cycle.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Annual bluegrass","url":"https://ipm.ucanr.edu/home-and-landscape/annual-bluegrass/"}]},{"id":"phalaris-canariensis","commonName":"Annual canarygrass","scientificName":"Phalaris canariensis","batch":2,"order":68,"summary":"Annual canarygrass carries compact, egg-shaped to cylindrical flower heads above flat leaves. Close inspection reveals broad, winged coverings around the individual spikelets, giving the head a distinctive overlapping texture. This annual grass grows from fibrous roots and occurs along roadsides and in disturbed ground. Its short, dense heads are useful features to check before confusing it with taller, spreading perennial canary grasses.","reviewedAt":"2026-10-09","sources":[{"label":"University of British Columbia: E-Flora BC canarygrass","url":"https://linnet.geog.ubc.ca/Atlas/Atlas.aspx?sciname=Phalaris+canariensis"}]},{"id":"iberis-amara","commonName":"Annual candytuft","scientificName":"Iberis amara","batch":2,"order":69,"summary":"Annual candytuft is a small, upright mustard-family plant grown for clusters of lightly fragrant flowers. Each flower has four petals, with the outer pair larger, and the flowering cluster stretches as the fruits develop. It occurs beyond gardens in old fields, lawns, and disturbed ground. Those uneven petals and rounded, notched fruits help separate it from the many other small mustards found in similar places.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of North America: Iberis amara","url":"https://www.efloras.org/florataxon.aspx?flora_id=1&taxon_id=200009565"},{"label":"NC State Extension: Annual candytuft","url":"https://plants.ces.ncsu.edu/plants/iberis-amara/"}]},{"id":"vulpia-myuros","commonName":"Annual fescue","scientificName":"Vulpia myuros","batch":2,"order":70,"summary":"Annual fescue, often called rattail fescue, has fine, folded leaves and long, narrow flower heads tipped with slender bristles. It completes its life cycle as an annual and can blend into a mixed stand of grasses until the heads develop. Some references call it Festuca myuros. That alternate name is worth recognizing when comparing botanical guides or local records of this grass.","reviewedAt":"2026-10-09","sources":[{"label":"Oregon State University: Rattail fescue","url":"https://ippc2.orst.edu/mint/ratfescue.htm"},{"label":"UF/IFAS Assessment: Festuca myuros","url":"https://assessment.ifas.ufl.edu/assessments/festuca-myuros/"}]},{"id":"stachys-annua","commonName":"Annual hedgenettle","scientificName":"Stachys annua","batch":2,"order":71,"summary":"Annual hedgenettle is a small member of the mint family with toothed leaves and pale yellow to white flowers. It grows from a taproot and completes its life in one season, unlike hedgenettles that spread by underground rhizomes. Fields, roadsides, and waste ground are typical places to encounter it. Flower color and the narrowing leaf bases help distinguish it from the similar field hedgenettle.","reviewedAt":"2026-10-09","sources":[{"label":"Native Plant Trust Go Botany: Stachys annua","url":"https://gobotany.nativeplanttrust.org/species/stachys/annua/?key=dichotomous"}]},{"id":"mercurialis-annua","commonName":"Annual mercury","scientificName":"Mercurialis annua","batch":2,"order":72,"summary":"Annual mercury is a branching herb with small, inconspicuous flowers and toothed, pointed leaves. Male flowers appear in longer clusters, while female flowers sit singly or in small groups; plants are usually separate sexes, although other arrangements occur. It occupies open, disturbed habitats. Its varied breeding systems have made this otherwise easily overlooked weed an interesting subject for research on plant reproduction.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of New Zealand: Mercurialis annua","url":"https://www.nzflora.info/factsheet/Taxon/Mercurialis-annua.html"},{"label":"USDA APHIS: Mercurialis annua weed risk assessment","url":"https://www.aphis.usda.gov/media/document/59910/file"},{"label":"Hesse and Pannell: Sexual dimorphism in Mercurialis annua","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2605799/"}]},{"id":"polypogon-monspeliensis","commonName":"Annual rabbitsfoot grass","scientificName":"Polypogon monspeliensis","batch":2,"order":73,"summary":"Annual rabbitsfoot grass earns its name from soft, densely packed flower heads that turn from pale green toward tan. It forms clumps in moist ground, including ditch banks, stream edges, pastures, and irrigated fields. Mild winters allow it to grow as a winter annual, while colder places favor summer growth. It reproduces by seed, and its fluffy heads are the clearest feature to notice.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Rabbitfoot polypogon","url":"https://ipm.ucanr.edu/weeds-identification-gallery/rabbitfoot-polypogon/"}]},{"id":"lolium-multiflorum","commonName":"Annual ryegrass","scientificName":"Lolium multiflorum","batch":2,"order":74,"summary":"Annual ryegrass grows vigorously through cool weather and is familiar as a forage, turf, and cover-crop grass. It also turns up in agricultural land and other disturbed places, where its rapid growth can make it weedy. Plants may survive for more than one season. Crosses with perennial ryegrass can blur the usual identification features, so the boundary between the two is not always obvious in the field.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Italian ryegrass","url":"https://ipm.ucanr.edu/weeds-identification-gallery/italian-ryegrass/"}]},{"id":"diplotaxis-muralis","commonName":"Annual wallrocket","scientificName":"Diplotaxis muralis","batch":2,"order":75,"summary":"Annual wallrocket is a low, yellow-flowered mustard with most of its toothed or lobed leaves near the base. Slender flowering stems eventually bear narrow seed pods. It often grows beside roads and in dry, disturbed ground, and some plants survive beyond a single year. Compared with perennial wallrocket, it generally has fewer leaves up the stem, a useful detail when the two look similar.","reviewedAt":"2026-10-09","sources":[{"label":"University of Udine Flora: Diplotaxis muralis","url":"https://flora.uniud.it/scheda.php?id=1256"}]},{"id":"melilotus-indicus","commonName":"Annual yellow sweetclover","scientificName":"Melilotus indicus","batch":2,"order":76,"summary":"Annual yellow sweetclover is a small, branching legume with three-part leaves and short clusters of tiny yellow flowers. Its nearly round pods usually contain a single seed and show a fine network of surface veins. It occurs in cultivated and disturbed ground, including orchards and winter cereal fields. The small flowers and compact pods are helpful details when distinguishing it from other sweetclovers.","reviewedAt":"2026-10-09","sources":[{"label":"INRAE Hypp: Melilotus indicus","url":"https://ephytia.inra.fr/fr/C/12354/Hypp-encyclopedie-en-protection-des-plantes-Melilotus-indicus"}]},{"id":"tapinoma-litorale","commonName":"Ant","scientificName":"Tapinoma litorale","batch":2,"order":77,"summary":"Tapinoma litorale nests in hollow twigs and vines, using small plant cavities that can easily escape notice during a casual walk. A survey of Florida Keys ants documented it on numerous islands, from Key Largo to Key West. The researchers treated it as native to Florida and the West Indies, placing this inconspicuous ant within the region's resident tropical fauna.","reviewedAt":"2026-10-09","sources":[{"label":"Journal of Insect Science: Ants of the Florida Keys","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5657926/"}]},{"id":"anoecia-vagans","commonName":"Aphid","scientificName":"Anoecia vagans","batch":2,"order":78,"summary":"This aphid links dogwood shrubs with the hidden world beneath grass. Its seasonal cycle moves between Cornus sanguinea and grass roots, including those of cereals; the root-feeding adults range from pale yellow to olive. Spring migrants differ from the similar dogwood aphid Anoecia corni in lacking its dark rear abdominal patch, a useful distinction when investigating aphids around dogwoods and nearby turf.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Anoecia vagans","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_A/"}]},{"id":"aphis-eugeniae","commonName":"Aphid","scientificName":"Aphis eugeniae","batch":2,"order":79,"summary":"Aphis eugeniae is associated with tropical and subtropical plants, with spurges and Glochidion among its important hosts. The specialist identification guide records it from eastern and southeastern Asia and Australia, and notes that it can share a host with Aphis spiraecola in Hawaii. That overlap makes the plant alone an unreliable identification clue; the guide does not implicate this species in plant-virus transmission.","reviewedAt":"2026-10-09","sources":[{"label":"AphID: Aphis eugeniae","url":"https://aphid.aphidnet.org/Aphis_eugeniae.php"}]},{"id":"asiphonella-dactylonii","commonName":"Aphid","scientificName":"Asiphonella dactylonii","batch":2,"order":80,"summary":"Much of this aphid's life takes place near or below the soil surface on grasses such as bermudagrass. The small root-feeding forms are pale yellow-green with a darker head and a bluish wax coating. In China its life cycle includes Chinese pistache, while populations elsewhere can persist on grass roots without a sexual generation, helping explain why it may be encountered far from its woody host.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Asiphonella dactylonii","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_A/"}]},{"id":"cerataphis-lataniae","commonName":"Aphid","scientificName":"Cerataphis lataniae","batch":2,"order":81,"summary":"A flattened brown body edged with white wax gives this palm aphid an appearance quite unlike the familiar green garden aphid. It occurs on palms in tropical settings and glasshouses, including fan palms and raffia palms. Older records need care because it has often been confused with Cerataphis brasiliensis; microscopic hairs beneath the head help separate them, so damage attributed to one should not automatically be assigned to the other.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Cerataphis lataniae","url":"https://aphidsonworldsplants.info/d_APHIDS_C/"}]},{"id":"dysaphis-crataegi","commonName":"Aphid","scientificName":"Dysaphis crataegi","batch":2,"order":82,"summary":"The hawthorn-carrot aphid can be easy to miss because colonies occupy the carrot crown and roots, often just below the soil surface. Individuals vary from yellowish gray to greenish gray and carry a light wax coating. Ants around the plant base can provide a clue to these concealed colonies, making a look at the crown more informative than inspecting only the exposed foliage.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Crown and root aphids","url":"https://ipm.ucanr.edu/agriculture/carrot/crown-and-root-aphids/"}]},{"id":"eucallipterus-tiliae","commonName":"Aphid","scientificName":"Eucallipterus tiliae","batch":2,"order":83,"summary":"Sticky pavement beneath a linden can reveal this aphid before the insects themselves are noticed. Colonies feed beneath the leaves and release abundant honeydew, which can also support dark sooty mold on surfaces below. Established trees usually tolerate feeding, although saplings can lose normal growth; the aphids remain associated with lindens through their seasonal cycle rather than switching to another kind of plant.","reviewedAt":"2026-10-09","sources":[{"label":"UMass Extension: Linden aphid","url":"https://www.umass.edu/agriculture-food-environment/landscape/publications-resources/insect-mite-guide/eucallipterus-tiliae"}]},{"id":"geoica-setulosa","commonName":"Aphid","scientificName":"Geoica setulosa","batch":2,"order":84,"summary":"Geoica setulosa lives on grass roots, where its relationship with ants can make it more noticeable than its underground feeding. USDA researchers documented colonies associated with mound-building ants in turf; the mounds themselves disrupted mowing. Its host list includes numerous grasses, so finding it beneath a lawn does not point to a single grass species, and its presence should be distinguished from the visible effects of its ant partners.","reviewedAt":"2026-10-09","sources":[{"label":"USDA Agricultural Research Service: Geoica setulosa in eastern North America","url":"https://www.ars.usda.gov/research/publications/publication/?seqNo115=118187"},{"label":"AphID: Geoica setulosa","url":"https://aphid.aphidnet.org/Geoica_setulosa.php"}]},{"id":"geopemphigus-floccosus","commonName":"Aphid","scientificName":"Geopemphigus floccosus","batch":2,"order":85,"summary":"Tufts of white wax cover the pale body of this small root aphid. It has been collected on morning-glory roots and recorded across parts of the Americas, including the southern United States. Its underground habits contrast with the conspicuous galls made by many related aphids: a proposed connection to galls on Mexican pistache remains unconfirmed, so that possible alternate host should not be treated as established biology.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Geopemphigus floccosus","url":"https://aphidsonworldsplants.info/d_APHIDS_G/"}]},{"id":"greenidea-ficicola","commonName":"Aphid","scientificName":"Greenidea ficicola","batch":2,"order":86,"summary":"This fig-feeding aphid has a pear-shaped body and strikingly long, outward-curving cornicles, the paired tubes near its rear. Colonies occur on young fig leaves, shoots and sometimes fruit, including ornamental Ficus plants that have helped carry it beyond its original range. Colors vary from green to brown, while the unusually long cornicles offer a more useful clue than color alone.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Greenidea ficicola","url":"https://aphidsonworldsplants.info/d_APHIDS_G/"}]},{"id":"hyalopterus-amygdali","commonName":"Aphid","scientificName":"Hyalopterus amygdali","batch":2,"order":87,"summary":"A coating of white wax gives this slender green aphid its mealy appearance on the undersides of almond leaves. It also occurs on apricot and migrates to reeds, connecting orchard trees with wetland vegetation over its seasonal cycle. Closely related Hyalopterus species look very similar, and reed populations are not all securely distinguished, so records based only on a pale, powdery colony need careful interpretation.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Hyalopterus amygdali","url":"https://aphidsonworldsplants.info/d_APHIDS_H/"}]},{"id":"hyperomyzus-lactucae","commonName":"Aphid","scientificName":"Hyperomyzus lactucae","batch":2,"order":88,"summary":"Sowthistles provide an important home for this broad-bodied green aphid, whose colonies favor young leaf undersides. In seasonal climates its cycle also involves currants or gooseberries, while mild Hawaiian conditions allow successive generations of females throughout the year. Its agricultural importance extends beyond plants where it forms colonies: visiting winged aphids can transmit viruses even to crops on which they cannot complete development.","reviewedAt":"2026-10-09","sources":[{"label":"University of Hawaii: Sowthistle aphid","url":"https://cms.ctahr.hawaii.edu/ckm/Home/Insects-and-Other-Pests/Aphids/Hyperomyza-lactucae"}]},{"id":"hyperomyzus-picridis","commonName":"Aphid","scientificName":"Hyperomyzus picridis","batch":2,"order":89,"summary":"On a hawkweed oxtongue, a small colony just below the flower heads may belong to Hyperomyzus picridis. Wingless adults are glossy yellow-green with dusky cornicles and brownish markings between body segments. The seasonal cycle links alpine currant with herbs such as Picris and Crepis; this specific host pairing helps explain where to look, without assuming that every green aphid on a daisy-family plant is the same species.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Hyperomyzus picridis","url":"https://aphidsonworldsplants.info/d_APHIDS_H/"}]},{"id":"macrosiphoniella-tanacetaria","commonName":"Aphid","scientificName":"Macrosiphoniella tanacetaria","batch":2,"order":90,"summary":"Summer tansy flowers can carry this relatively large aphid, often more than three millimeters long. Its gray-green body has a light wax covering, contrasting with dark legs, antennae and rear tubes. Colonies gather around flowering stems and flower heads, and the seasonal cycle stays on tansy, making the plant a useful place to observe successive generations.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Macrosiphoniella tanacetaria","url":"https://aphidsonworldsplants.info/d_APHIDS_M/"}]},{"id":"macrosiphum-lilii","commonName":"Aphid","scientificName":"Macrosiphum lilii","batch":2,"order":91,"summary":"A purple blotch on a pale yellow or orange abdomen gives the purplespotted lily aphid its memorable name. Long black antennae and cornicles, along with dark knees and feet, add to its distinctive appearance on Asiatic lilies. Like other sap-feeding aphids it releases sugary honeydew, so shiny deposits on leaves can draw attention to a colony before its unusual markings are noticed.","reviewedAt":"2026-10-09","sources":[{"label":"NC State Extension: Purplespotted lily aphid","url":"https://content.ces.ncsu.edu/purplespotted-lily-aphid"}]},{"id":"melanaphis-sorini","commonName":"Aphid","scientificName":"Melanaphis sorini","batch":2,"order":92,"summary":"This tiny Miscanthus aphid ranges from tan to wine-purple. Recorded in Japan and Taiwan, it has also been introduced to California and Florida. Its resemblance to a sugarcane-associated relative can be misleading: a studied Florida population did not establish on sugarcane, making the host especially important when interpreting a report or examining an ornamental grass colony.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Melanaphis sorini","url":"https://aphidsonworldsplants.info/d_APHIDS_M/"}]},{"id":"metopolophium-festucae","commonName":"Aphid","scientificName":"Metopolophium festucae","batch":2,"order":93,"summary":"This grass-feeding aphid may be green, yellow-green or salmon pink, with dark abdominal bands in the winged form. Its name encompasses populations that differ subtly in their relationship with cereals. The typical form mainly inhabits wild grasses, while the separately named subspecies cerealium is more closely associated with grain crops; that distinction matters when interpreting agricultural records filed under the broader species name.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Metopolophium festucae","url":"https://aphidsonworldsplants.info/d_APHIDS_M/"},{"label":"Kansas State University: Distinguishing cerealium","url":"https://blogs.k-state.edu/kansasbugs/2018/05/18/metopolophium-festucae-cerealium-stroyan-a-new-aphid-in-kansas-wheat/"}]},{"id":"metopolophium-festucae-cerealium","commonName":"Aphid","scientificName":"Metopolophium festucae cerealium","batch":2,"order":94,"summary":"The cereal-associated form of Metopolophium festucae feeds on crops including wheat, barley and oats. Wingless adults are pale yellow and elongated, while winged adults carry darker markings across the back. Significant infestations documented in the Pacific Northwest drew attention to this subspecies, but an occurrence does not by itself establish crop loss: numbers, crop stage and the activity of aphid predators all influence its practical importance.","reviewedAt":"2026-10-09","sources":[{"label":"Kansas State University: Metopolophium festucae cerealium","url":"https://blogs.k-state.edu/kansasbugs/2018/05/18/metopolophium-festucae-cerealium-stroyan-a-new-aphid-in-kansas-wheat/"}]},{"id":"myzaphis-rosarum","commonName":"Aphid","scientificName":"Myzaphis rosarum","batch":2,"order":95,"summary":"Small rose aphids can remain hidden inside rose leaflets that have not yet unfolded. Myzaphis rosarum is a tiny yellow-green to green species with short antennae and swollen cornicles, feeding along veins on both sides of leaves. It also uses shrubby cinquefoils, and outbreaks are uncommon; its discreet habits make it easy to overlook among the more conspicuous aphids found on garden roses.","reviewedAt":"2026-10-09","sources":[{"label":"INRAE Aphid Encyclopedia: Myzaphis rosarum","url":"https://encyclopedie-pucerons.hub.inrae.fr/fiche-especes/pucerons/myzaphis/m.-rosarum"}]},{"id":"myzus-varians","commonName":"Aphid","scientificName":"Myzus varians","batch":2,"order":96,"summary":"Tightly rolled, cigar-shaped peach leaves are a characteristic sign of this aphid's feeding. Pale green wingless adults gather beneath the leaves, whose margins curl lengthwise and may redden as the damage develops. The seasonal cycle includes eggs near peach buds and a migration to clematis, showing how an insect noticed in an orchard can depend on a quite different plant later in the year.","reviewedAt":"2026-10-09","sources":[{"label":"INRAE Ephytia: Myzus varians","url":"https://ephytia.inra.fr/fr/C/12197/Hypp-encyclopedie-en-protection-des-plantes-Myzus-varians"}]},{"id":"pleotrichophorus-chrysanthemi","commonName":"Aphid","scientificName":"Pleotrichophorus chrysanthemi","batch":2,"order":97,"summary":"Florists' chrysanthemums host this pale green to yellowish aphid, which can gather in large colonies beneath yellowing leaves. Adults are roughly two millimeters long, and no sexual forms are known in the specialist account. Its close resemblance to Pleotrichophorus glandulosus has raised questions about their separation, so careful identification is useful when tracing greenhouse infestations or comparing records made under the two names.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Pleotrichophorus chrysanthemi","url":"https://aphidsonworldsplants.info/d_APHIDS_P/"}]},{"id":"rhopalomyzus-lonicerae","commonName":"Aphid","scientificName":"Rhopalomyzus lonicerae","batch":2,"order":98,"summary":"This aphid changes both host and appearance through the season. Spring colonies on honeysuckle contain dark green, wax-dusted insects that roll leaves downward and produce yellow or red spotting. Later generations move to grasses, especially reed canarygrass, where pale yellow colonies develop on the leaves; recognizing that connection helps make sense of two very different-looking infestations near the same patch of vegetation.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Rhopalomyzus lonicerae","url":"https://aphidsonworldsplants.info/d_APHIDS_R/"}]},{"id":"rhopalosiphum-rufiabdominalis","commonName":"Aphid","scientificName":"Rhopalosiphum rufiabdominalis","batch":2,"order":99,"summary":"The rice root aphid spends much of its life out of sight on underground plant parts. Despite its common name, it uses many grasses, sedges and some broadleaf crops; populations can also persist in warm greenhouses and hydroponic systems. Root-feeding adults range from green to brown with rusty coloring toward the rear, and the accepted spelling Rhopalosiphum rufiabdominale frequently appears in specialist literature.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Rhopalosiphum rufiabdominale","url":"https://aphidsonworldsplants.info/d_APHIDS_R/"}]},{"id":"sipha-glyceriae","commonName":"Aphid","scientificName":"Sipha glyceriae","batch":2,"order":100,"summary":"Wetland grasses are a good place to encounter Sipha glyceriae, a small green aphid that sometimes has reddish coloring or a paler stripe along its back. Its recorded plants include sweetgrasses and other grasses as well as sedges and rushes. It completes its seasonal cycle without a woody alternate host, linking its biology directly to the herbaceous vegetation of marshy places.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Sipha glyceriae","url":"https://aphidsonworldsplants.info/d_APHIDS_S/"}]},{"id":"sipha-maydis","commonName":"Aphid","scientificName":"Sipha maydis","batch":3,"order":101,"summary":"A glossy, almost black body makes this tiny aphid stand out among the greener insects on grasses. Wingless adults are roughly 1 to 2 millimeters long, with short antennae and stiff, spine-like hairs. Sipha maydis feeds on leaves and stems of cereals and other grasses, including wheat, barley, and corn, giving it a close connection to both crop fields and grassy vegetation.","reviewedAt":"2026-10-09","sources":[{"label":"Argentina SENASA: Sipha maydis","url":"https://www.sinavimo.gob.ar/plaga/sipha-maydis"}]},{"id":"tinocallis-ulmiparvifoliae","commonName":"Aphid","scientificName":"Tinocallis ulmiparvifoliae","batch":3,"order":102,"summary":"Chinese elm is the plant to look at for this delicate aphid. Its winged adults are pale blue-green, with white wax stripes across the head and thorax and small waxy spots on the abdomen. At only about 2 millimeters long, these details need a close view; dark marks at the ends of some wing veins provide another useful identification clue.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Aphids on the World's Plants","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_T/"}]},{"id":"tuberocephalus-sakurae","commonName":"Aphid","scientificName":"Tuberocephalus sakurae","batch":3,"order":103,"summary":"Curled, reddened cherry leaves can draw attention to this aphid before the insects themselves are visible. Adults and young shelter inside the distorted leaves, and an adult may be only about 1.5 millimeters long. Hokkaido forestry researchers describe this distinctive summer damage on flowering cherries, including the Japanese mountain cherry, making the leaf's shape an especially useful clue to its presence.","reviewedAt":"2026-10-09","sources":[{"label":"Hokkaido Research Organization: Tuberocephalus sakurae","url":"https://www.hro.or.jp/forest/research/fri/database/zukanf/00top/kamemusi/abura/sakurako/note.html"}]},{"id":"uroleucon-picridis","commonName":"Aphid","scientificName":"Uroleucon picridis","batch":3,"order":104,"summary":"Clusters of shiny reddish-brown aphids just below oxtongue flowers may belong to Uroleucon picridis. Wingless adults have dark antennae and dark rear tubes, contrasting with a yellow tail-like tip and paler bases to parts of the legs. Its strongest host association is with Picris plants; several records from other flower genera may involve similar aphids, so the host is a clue rather than a complete identification.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Aphids on the World's Plants","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_U/"}]},{"id":"aphidius-ervi","commonName":"Aphid parasite","scientificName":"Aphidius ervi","batch":3,"order":105,"summary":"This small black wasp spends its early life hidden inside an aphid. A female uses her antennae to inspect a potential host, then deposits an egg; the developing wasp leaves behind a swollen aphid mummy and eventually emerges through a round opening. Aphidius ervi is used in greenhouse biological control, where those mummies are a visible sign of its otherwise easily overlooked work.","reviewedAt":"2026-10-09","sources":[{"label":"Kansas State University: Aphidius colemani and Aphidius ervi","url":"https://bookstore.ksre.ksu.edu/pubs/aphidius-colemani-and-aphidius-ervi-biological-control-agents-of-aphids_MF3653.pdf"}]},{"id":"aphis-pomi","commonName":"Apple aphid","scientificName":"Aphis pomi","batch":3,"order":106,"summary":"Apple aphids gather on tender new shoots, where their yellow-green bodies can blend into fresh foliage. They survive winter as shiny black eggs on twigs and fruit spurs, then build colonies as growth resumes. Heavy colonies can distort young shoots and leave sticky honeydew that supports sooty mold, although predators and other natural enemies often keep their numbers in check.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Green Apple Aphid","url":"https://ipm.ucanr.edu/agriculture/apple/green-apple-aphid/"}]},{"id":"cassia-javanica","commonName":"Apple blossom","scientificName":"Cassia javanica","batch":3,"order":107,"summary":"Apple-blossom cassia is a tropical tree whose clusters of pink flowers soften toward paler shades as they age. Each compound leaf carries many paired leaflets, while the long, cylindrical pods reveal its membership in the bean family. Its showy flowers have made it a familiar ornamental, but the species includes several forms that botanists distinguish using small leaf-base structures and flower details.","reviewedAt":"2026-10-09","sources":[{"label":"New York Botanical Garden: Cassia javanica monograph","url":"https://sweetgum.nybg.org/science/world-flora/monographs-details/?irn=17210"}]},{"id":"cassia-javanica-var-indochinensis","commonName":"Apple blossom","scientificName":"Cassia javanica var. indochinensis","batch":3,"order":108,"summary":"This form of apple-blossom cassia is associated with the pink-flowered trees widely grown in tropical gardens and streets. Its distinction from typical Cassia javanica rests mainly on smaller stipules at the leaf bases and shorter sepals around the flowers, rather than petal color. Botanical treatments differ in rank: the Bishop Museum places this older variety name under Cassia javanica subsp. agnes.","reviewedAt":"2026-10-09","sources":[{"label":"New York Botanical Garden: Cassia javanica var. indochinensis","url":"https://sweetgum.nybg.org/science/world-flora/narratives-details/?irn=4879"},{"label":"Bishop Museum: Cassia javanica subsp. agnes synonyms","url":"https://plantsofhawaii.org/detail/%7B5EBF25F3-6B53-4672-B0FC-2262124968EB%7D"}]},{"id":"phenacoccus-aceris","commonName":"Apple mealybug","scientificName":"Phenacoccus aceris","batch":3,"order":109,"summary":"A powdery white coat and a fringe of short waxy projections disguise the apple mealybug's darker, oval body. It feeds on tree leaves and branches, and a mature female produces a conspicuous white egg sac that largely covers her body. Beyond the insects themselves, sticky honeydew and the sooty mold it supports can make an infestation noticeable on orchard fruit and foliage.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Phenacoccus aceris","url":"https://scalenet.info/catalogue/Phenacoccus%20aceris/"},{"label":"Washington State University: Apple Mealybug","url":"https://treefruit.wsu.edu/crop-protection/opm/apple-mealybug/"}]},{"id":"mentha-suaveolens","commonName":"Apple mint","scientificName":"Mentha suaveolens","batch":3,"order":110,"summary":"Apple mint has softly hairy, wrinkled leaves with toothed edges and a fruity mint scent. This creeping perennial favors damp places and sends up dense spikes of pink to white flowers above its foliage. Its familiar place in herb gardens can hide how readily it spreads in open ground, so a patch's expanding footprint is as characteristic as its aroma.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens, Kew: Mentha suaveolens","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:451188-1/general-information"}]},{"id":"nicandra-physalodes","commonName":"Apple of Peru","scientificName":"Nicandra physalodes","batch":3,"order":111,"summary":"Sky-blue, cup-shaped flowers with white centers give apple of Peru a gardenlike appearance even when it grows among crops. This summer annual has hollow, strongly ridged stems and broad leaves with toothed or lobed edges. Papery coverings surround its many-seeded fruits; its escape from cultivation into soybean fields shows how an ornamental plant can become a persistent agricultural concern.","reviewedAt":"2026-10-09","sources":[{"label":"Missouri State University: Apple-of-Peru","url":"https://ag.missouristate.edu/PBTrewatha/appleofperu.htm"}]},{"id":"jasminum-sambac","commonName":"Arabian jasmine","scientificName":"Jasminum sambac","batch":3,"order":112,"summary":"Arabian jasmine is a scrambling evergreen shrub or climber with glossy, broadly oval leaves and clusters of strongly scented white flowers. The blooms can become pink as they age, and cultivated forms include richly doubled flowers. Long grown for its fragrance, this jasmine supplies flowers used to scent tea; its botanical home is in tropical Asia, despite the geographic suggestion in its common name.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Victoria: Jasminum sambac","url":"https://hortflora.rbg.vic.gov.au/taxon/ada21b22-5340-11e7-b82b-005056b0018f"},{"label":"Royal Botanic Gardens, Kew: Jasminum sambac","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:609755-1/general-information"}]},{"id":"schismus-arabicus","commonName":"Arabian schismus","scientificName":"Schismus arabicus","batch":3,"order":113,"summary":"Arabian schismus is a small annual grass that forms low tufts with fine leaves and compact flower clusters in dry, open places. It reproduces by seed, and some plants break loose and tumble, scattering seed as they move. In desert shrubland, its dried growth can help carry fire between larger plants, although it closely resembles common Mediterranean grass and can be difficult to identify confidently.","reviewedAt":"2026-10-09","sources":[{"label":"University of California Weed Research and Information Center: Mediterraneangrasses","url":"https://www.cal-ipc.org/wp-content/uploads/WMN/Schismus.pdf"},{"label":"California Invasive Plant Council: Schismus arabicus","url":"https://www.cal-ipc.org/plants/profile/schismus-arabicus-profile/"}]},{"id":"brachyrhynchus-membranaceus","commonName":"Aradid flat bug","scientificName":"Brachyrhynchus membranaceus","batch":3,"order":114,"summary":"This flat bug belongs to a group shaped for life in narrow spaces around decaying wood. Brachyrhynchus membranaceus feeds on fungal threads, linking it to the hidden community involved in wood decomposition. Its connection to fungi also matters commercially: researchers have reported damage to cultivated bracket fungi, showing that a small forest-associated insect can become troublesome when its food is grown as a crop.","reviewedAt":"2026-10-09","sources":[{"label":"USDA ARS: Brachyrhynchus membranaceus research","url":"https://www.ars.usda.gov/research/publications/publication/?seqNo115=290643"}]},{"id":"neophyllaphis-araucariae","commonName":"Araucaria aphid","scientificName":"Neophyllaphis araucariae","batch":3,"order":115,"summary":"Bright yellow to orange-yellow aphids on fresh Araucaria growth may be this tiny conifer specialist. Wingless adults are broad and oval, usually only about 1 to 1.5 millimeters long, so their host plant is an important first clue. Their association with young shoots makes the newest growth more informative to inspect than older foliage, while a close examination is still needed to separate similar insects.","reviewedAt":"2026-10-09","sources":[{"label":"Blackman and Eastop: Aphids on the World's Plants","url":"https://aphidsonworldsplants.info.aphidnet.org/d_aphids_N/"}]},{"id":"lindingaspis-rossi","commonName":"Araucaria black scale","scientificName":"Lindingaspis rossi","batch":3,"order":116,"summary":"Araucaria black scale looks like a small, flat, dark disk attached to a leaf. The female's nearly circular cover is brown to black, with an especially dark spot close to its center where shed skins are inc
