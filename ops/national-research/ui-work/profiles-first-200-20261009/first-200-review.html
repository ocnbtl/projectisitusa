orporated. Despite its common name, this scale uses many kinds of plants, including oleander and citrus as well as Araucaria, so the host name alone does not define it.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Lindingaspis rossi","url":"https://scalenet.info/catalogue/Lindingaspis%20rossi/"}]},{"id":"opuntia-leucotricha","commonName":"Arborescent pricklypear","scientificName":"Opuntia leucotricha","batch":3,"order":117,"summary":"This pricklypear can grow into a branching shrub with a distinct trunk, giving it a small-tree silhouette. Its gray-green pads carry fine pale hairs and flexible white spines that can become especially conspicuous on older growth. Looking at the trunk, pad surface, and spines together is more useful than relying on the general pricklypear shape, which it shares with many other cacti.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Sydney PlantNET: Opuntia leucotricha","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Opuntia~leucotricha&page=nswfl"}]},{"id":"linepithema-humile","commonName":"Argentine Ant","scientificName":"Linepithema humile","batch":3,"order":118,"summary":"Argentine ants are small, uniformly brown workers, often noticed as busy trails around gardens and buildings. Their colonies can contain many queens and linked nesting sites, sometimes supporting millions of ants. They nest in shallow soil and sheltered spaces beneath wood, mulch, or paving, which helps explain why a trail at one doorway may be only a small visible part of a much larger colony.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Argentine Ant","url":"https://ipm.ucanr.edu/TOOLS/ANTKEY/argentine.html"}]},{"id":"salvator-merianae","commonName":"Argentine Black and White Tegu","scientificName":"Salvator merianae","batch":3,"order":119,"summary":"The Argentine black and white tegu is a large South American lizard that can reach 4 to 5 feet long. Active by day, it eats a broad mix of fruit, invertebrates, small vertebrates, and eggs, and shelters in burrows during colder months. That flexible diet is central to concern about introduced populations, because native reptiles and ground-nesting wildlife can become part of its food supply.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Florida Invader, Tegu Lizard","url":"https://rcrec-ona.ifas.ufl.edu/media/rcrec-onaifasufledu/pdf/Florida-Invader.pdf"}]},{"id":"lepidium-bonariense","commonName":"Argentine pepperweed","scientificName":"Lepidium bonariense","batch":3,"order":120,"summary":"Argentine pepperweed is a modest mustard-family plant with hairy stems and finely divided lower leaves. Its tiny pale flowers give way to rounded, flattened seedpods with a small notch at the tip, often offering a clearer identification clue than the flowers. Lower leaves may already have fallen by flowering time, so young plants and mature fruiting stems can look surprisingly different.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of New Zealand: Lepidium bonariense","url":"https://www.nzflora.info/factsheet/taxon/Lepidium-bonariense.html"}]},{"id":"aonidiella-taxus","commonName":"Armored scale","scientificName":"Aonidiella taxus","batch":3,"order":121,"summary":"Aonidiella taxus hides beneath a pale, partly transparent scale cover about 2 millimeters across. The female beneath it changes from light brown toward reddish brown as she matures, while males develop narrower covers and eventually become winged adults. Associated with ornamental conifers, it can resemble several related scales, so a close view of the cover is useful for detection but microscopic features are needed for a confident species identification.","reviewedAt":"2026-10-09","sources":[{"label":"Naturalis: Diaspididae of the World, Aonidiella taxus","url":"https://diaspididae.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/taxon.php?epi=155&id=113046"}]},{"id":"dynaspidiotus-pseudomeyeri","commonName":"Armored scale","scientificName":"Dynaspidiotus pseudomeyeri","batch":3,"order":122,"summary":"False Meyer scale forms slightly raised, oval to irregularly round covers that change from dull greenish yellow to a dirtier pale yellow with brown edging. Its recorded hosts include junipers, false cypresses, and arborvitae. Those subdued colors make it an unobtrusive resident of ornamental conifers, although researchers have documented damaging infestations; its resemblance to other scales makes careful identification more useful than judging by color alone.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Dynaspidiotus pseudomeyeri","url":"https://scalenet.info/catalogue/Dynaspidiotus%20pseudomeyeri/"}]},{"id":"gymnaspis-aechmeae","commonName":"Armored scale","scientificName":"Gymnaspis aechmeae","batch":3,"order":123,"summary":"Known as flyspeck scale, this insect is especially associated with bromeliads and greenhouse plants. A young female has a brown cover with a dark shed skin, while the adult remains enclosed within the skin of her previous growth stage. Females produce living young rather than simply depositing eggs, and damaging populations on ornamental bromeliads make these easily overlooked specks worth recognizing.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Gymnaspis aechmeae","url":"https://scalenet.info/catalogue/Gymnaspis%20aechmeae/"}]},{"id":"howardia-biclavis","commonName":"Armored scale","scientificName":"Howardia biclavis","batch":3,"order":124,"summary":"Mining scale can be hard to see because plant tissue partly conceals its rounded protective cover. It lives on the bark of many woody plants, with a pale white or yellow cover and a brownish spot formed from earlier shed skins. The name should not be taken as proof that it actively tunnels: published accounts disagree about how it becomes covered by the plant's outer tissue.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Howardia biclavis","url":"https://scalenet.info/catalogue/Howardia%20biclavis/"}]},{"id":"lepidosaphes-pinnaeformis","commonName":"Armored scale","scientificName":"Lepidosaphes pinnaeformis","batch":3,"order":125,"summary":"Small brown scales shaped like mussel shells on orchid leaves may be Lepidosaphes pinnaeformis. It favors orchids, although records include other plants, and sometimes settles on stems as well as foliage. Heavy colonies can leave discolored patches around feeding sites and spoil the leaves' appearance; the mobile young spread within plants, while movement of infested orchids can carry established colonies much farther.","reviewedAt":"2026-10-09","sources":[{"label":"Naturalis: Diaspididae of the World, Lepidosaphes pinnaeformis","url":"https://diaspididae.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/nsr_taxon.php?cat=TAB_DESCRIPTION&id=113094"}]},{"id":"lepidosaphes-yanagicola","commonName":"Armored scale","scientificName":"Lepidosaphes yanagicola","batch":3,"order":126,"summary":"Firebush scale forms narrow brown covers shaped like tiny oyster shells, with pale bodies hidden underneath. Fertilized females survive winter on their host plants, and the next generation begins as small mobile crawlers. Covers are usually straight but may bend when crowded; on heavily infested plants, scales can also occur near leaf midveins, making both woody growth and foliage useful places to look.","reviewedAt":"2026-10-09","sources":[{"label":"University of Massachusetts Amherst: Lepidosaphes yanagicola","url":"https://www.umass.edu/agriculture-food-environment/landscape/publications-resources/insect-mite-guide/lepidosaphes-yanagicola"}]},{"id":"neopinnaspis-harperi","commonName":"Armored scale","scientificName":"Neopinnaspis harperi","batch":3,"order":127,"summary":"Harper scale blends into bark so well that even dense colonies can escape notice. Its narrow, nearly flat tan covers are only 1 to 2 millimeters long, with darker shed skins gathered at one end and a pink or red female beneath. It settles especially in bark cracks on a wide range of woody hosts, including cotoneaster, ceanothus, and macadamia.","reviewedAt":"2026-10-09","sources":[{"label":"Naturalis: Diaspididae of the World, Neopinnaspis harperi","url":"https://diaspididae.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/taxon.php?id=113109"}]},{"id":"parlatoria-camelliae","commonName":"Armored scale","scientificName":"Parlatoria camelliae","batch":3,"order":128,"summary":"Camellia parlatoria scale forms small white to gray oval covers, each with a darker area in the incorporated shed skin. It is named for camellia but has been recorded from a much wider assortment of plants. Observations on camellia found males and females on both leaf surfaces, often near veins, so a pale speck beside a vein may deserve a closer look.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Parlatoria camelliae","url":"https://scalenet.info/catalogue/Parlatoria%20camelliae/"}]},{"id":"rutherfordia-major","commonName":"Armored scale","scientificName":"Rutherfordia major","batch":3,"order":129,"summary":"Lychee bark scale has a white protective cover that may look reddish brown or nearly black when plant tissue obscures it. The cover is rounded to oval, with brown shed skins near its edge. Although lychee gives this insect one of its common names, recorded hosts include other tropical trees and shrubs; its concealed appearance can make the living insect less obvious than the raised patch it creates.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Rutherfordia major","url":"https://scalenet.info/catalogue/Rutherfordia%20major/"}]},{"id":"selenaspidus-albus","commonName":"Armored scale","scientificName":"Selenaspidus albus","batch":3,"order":130,"summary":"This small armored scale forms a circular white cover about 1.75 millimeters across, marked by yellowish-brown shed skins slightly off center. Published records associate it with Euphorbia plants, where the pale disks can build into dense populations. Its simple appearance is a useful first clue, but it belongs to a group of similar-looking insects whose species distinctions depend on much finer anatomical details.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Selenaspidus albus","url":"https://scalenet.info/catalogue/Selenaspidus%20albus/"}]},{"id":"selenaspidus-articulatus","commonName":"Armored scale","scientificName":"Selenaspidus articulatus","batch":3,"order":131,"summary":"Selenaspidus articulatus forms flat, partly transparent disks with pale margins and a darker spot near the center. It often gathers on the sun-facing upper surfaces of leaves and uses many host plants, with citrus especially favored. Dense colonies can cause yellowing and tissue damage on leaves and fruit, connecting an insect that looks like a tiny surface blemish with a much larger effect on plant health.","reviewedAt":"2026-10-09","sources":[{"label":"Naturalis: Diaspididae of the World, Selenaspidus articulatus","url":"https://diaspididae.linnaeus.naturalis.nl/linnaeus_ng/app/views/species/taxon.php?id=113131"}]},{"id":"unaspis-citri","commonName":"Armored scale","scientificName":"Unaspis citri","batch":3,"order":132,"summary":"The snowy coating that gives citrus snow scale its name is made by the white covers of immature males. Females are less conspicuous, living beneath darker armor, and colonies mainly occupy trunks and larger limbs of citrus trees. Heavy, persistent infestations can weaken trees and contribute to bark splitting; the contrasting male and female covers are a reminder that one species can have very different appearances.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Citrus Snow Scale","url":"https://ask.ifas.ufl.edu/publication/IN1010"}]},{"id":"andaspis-punicae","commonName":"Armoured scale","scientificName":"Andaspis punicae","batch":3,"order":133,"summary":"This scale's long, narrow cover resembles a dark mussel shell, sometimes edged with a whitish deposit. Known in older literature as Andaspis punicae and now placed in Lepidosaphes, it is associated with woody hosts including lychee. Researchers have linked heavy infestations with declining tree vigor and branch dieback, making an insect that can pass for part of the bark relevant to tropical fruit growers.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Lepidosaphes punicae","url":"https://scalenet.info/catalogue/Lepidosaphes%20punicae/"},{"label":"USDA ARS: Andaspis punicae in lychee","url":"https://www.ars.usda.gov/research/publications/publication/?seqNo115=182901"}]},{"id":"fiorinia-proboscidaria","commonName":"Armoured scale","scientificName":"Fiorinia proboscidaria","batch":3,"order":134,"summary":"Snout scale has a glossy golden-brown, lance-shaped cover with a raised ridge down the middle. The adult female remains within an enlarged shed skin, and colonies can contain several life stages together on the undersides of leaves. Citrus is an important host, but close relatives look much alike, so recognizing the general shape is only a first step toward identifying this particular scale.","reviewedAt":"2026-10-09","sources":[{"label":"ScaleNet: Fiorinia proboscidaria","url":"https://scalenet.info/catalogue/Fiorinia%20proboscidaria/"}]},{"id":"dichrostachys-cinerea","commonName":"Aroma","scientificName":"Dichrostachys cinerea","batch":3,"order":135,"summary":"Aroma is a thorny shrub or small tree with finely divided leaves and especially distinctive hanging flower heads. Each head combines a yellow tip of fertile flowers with a pink or mauve section of sterile flowers, followed by crowded, twisted seed pods. Short side branches end in sharp spines, and suckering growth can produce thickets, giving this delicate-looking plant a much tougher presence than its flowers suggest.","reviewedAt":"2026-10-09","sources":[{"label":"Kew Plants of the World Online: Dichrostachys cinerea","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:492423-1/general-information"}]},{"id":"paspalum-paniculatum","commonName":"Arrocillo","scientificName":"Paspalum paniculatum","batch":3,"order":136,"summary":"Arrocillo is a coarse perennial grass that grows in substantial clumps, with broad, flat leaves and flowering stems that can rise above a person's waist. Its seed head has many slender branches spreading from a central stalk, each carrying closely arranged, rounded spikelets. Found in settings such as forest clearings and plantations, it is best recognized by that branching seed head rather than by its otherwise ordinary grass leaves.","reviewedAt":"2026-10-09","sources":[{"label":"Kew Plants of the World Online: Paspalum paniculatum","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:184526-2/general-information"}]},{"id":"pseudosasa-japonica","commonName":"Arrow bamboo","scientificName":"Pseudosasa japonica","batch":3,"order":137,"summary":"Arrow bamboo forms dense stands of upright canes topped with long, broad, glossy green leaves. Underground stems extend beyond the clump and send up new shoots, allowing a planting to occupy more ground over time. Its leaves can reach roughly a foot long, giving the stand a lush, leafy appearance; naturalized populations have been documented along roadsides, riverbanks, and forest edges after escape from gardens.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of New Zealand: Pseudosasa japonica","url":"https://floraseries.landcareresearch.co.nz/taxa/548d39f6-387d-439b-b0ef-c3c9fbee2c3e"}]},{"id":"xanthosoma-sagittifolium","commonName":"Arrowleaf elephant's ear","scientificName":"Xanthosoma sagittifolium","batch":3,"order":138,"summary":"Arrowleaf elephant's ear is a large tropical herb with long stalks supporting broad, arrow-shaped leaves above a thickened stem. The stalk joins the leaf at its base, a useful detail when comparing plants commonly called elephant's ears. It grows in shaded, moist settings such as forest understory and streambanks, and its flowers sit on a fleshy spike partly enclosed by a boat-shaped bract.","reviewedAt":"2026-10-09","sources":[{"label":"Singapore NParks: Xanthosoma sagittifolium","url":"https://www.nparks.gov.sg/florafaunaweb/flora/8/4/8443"}]},{"id":"caladium-bicolor","commonName":"Artist's pallet","scientificName":"Caladium bicolor","batch":3,"order":139,"summary":"Artist's pallet is a tuberous tropical plant grown for leaves that can combine green, white, pink, and red in striking patterns. The leaf stalk attaches within the blade rather than simply at its edge, and the broad leaves range from heart-shaped to arrow-shaped. Its small flowers are crowded onto a fleshy spike inside a pale bract, but the colorful foliage is usually what draws attention in a garden.","reviewedAt":"2026-10-09","sources":[{"label":"Kew Plants of the World Online: Caladium bicolor","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:30010088-2/general-information"}]},{"id":"diplosoma-listerianum","commonName":"Ascidian","scientificName":"Diplosoma listerianum","batch":3,"order":140,"summary":"This ascidian is a colony of tiny marine animals living together in a thin, shared outer covering. Each individual draws seawater through its own inlet, filters food from it, and releases the water through an opening shared with neighbors. Colonies grow across submerged surfaces such as docks, floats, and boat hulls, where their spreading sheets are part of the living community commonly described as marine fouling.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Diplosoma listerianum","url":"https://invasions.si.edu/nemesis/chesreport/species_summary/diplosoma%20listerianum"}]},{"id":"polyandrocarpa-zorritensis","commonName":"Ascidian","scientificName":"Polyandrocarpa zorritensis","batch":3,"order":141,"summary":"This colonial sea squirt forms groups of small, club-shaped individuals connected at their bases by rootlike strands. Each animal has its own tough outer covering, often coated with sand, and two openings used to move water through its filtering apparatus. Colonies expand by budding as well as reproducing sexually; their clustered shape helps distinguish them from ascidians that spread as flat sheets over submerged surfaces.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Polyandrocarpa zorritensis","url":"https://invasions.si.edu/nemesis/galapagos/species_summary/159423"}]},{"id":"siphoninus-phillyreae","commonName":"Ash whitefly","scientificName":"Siphoninus phillyreae","batch":3,"order":142,"summary":"Ash whitefly is a sap-feeding insect whose adults carry a light dusting of white wax. On leaf undersides, the settled immature stages are more distinctive: their tiny cases bear white wax tufts and glassy projections tipped with wax droplets. Despite its name, it feeds on many ornamental and fruit trees, and heavy infestations can cause wilting, early leaf loss, and smaller fruit.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Ash Whitefly","url":"https://edis.ifas.ufl.edu/publication/IN304/pdf"}]},{"id":"potentilla-inclinata","commonName":"Ashy cinquefoil","scientificName":"Potentilla inclinata","batch":3,"order":143,"summary":"Ashy cinquefoil is a perennial herb with upright or ascending, softly hairy stems and small yellow flowers. Its leaves divide into five to seven deeply toothed leaflets, pale green above and grayish with hairs beneath, giving the plant its ashy appearance. It grows in dry, sandy grassland and disturbed places such as roadsides and railway banks; the leaflet shape and hairs help separate it from similar cinquefoils.","reviewedAt":"2026-10-09","sources":[{"label":"German Federal Agency for Nature Conservation FloraWeb: Potentilla inclinata","url":"https://www.floraweb.de/php/artenhome.php?suchnr=4519"}]},{"id":"sphaerodactylus-elegans","commonName":"Ashy gecko","scientificName":"Sphaerodactylus elegans","batch":3,"order":144,"summary":"Ashy gecko is a tiny lizard whose appearance changes dramatically with age: brightly banded young with reddish tails become tan or rusty brown adults covered in pale speckles. It favors moist hiding places in leaf litter, beneath bark, and among wood or rocks, often near buildings. Although much of its life is spent close to the ground, it also climbs fences and trees while searching for small prey.","reviewedAt":"2026-10-09","sources":[{"label":"Heagy and Frank, The Reef Geckos of Florida, Iguana (2008)","url":"https://journals.ku.edu/iguana/article/download/17750/16010/42304"}]},{"id":"eriocaulon-cinereum","commonName":"Ashy pipewort","scientificName":"Eriocaulon cinereum","batch":3,"order":145,"summary":"Ashy pipewort is a small annual that forms a tight tuft of narrow, pointed leaves close to the ground. Slender stalks rise above the tuft, each ending in a tiny rounded flower head colored gray, straw brown, or darker brown. It grows along drying pool margins and seepages, and has also become associated with rice cultivation, where its buttonlike heads help distinguish it from young grasses.","reviewedAt":"2026-10-09","sources":[{"label":"Kew Plants of the World Online: Eriocaulon cinereum","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:335192-1/general-information"}]},{"id":"polypogon-fugax","commonName":"Asia minor bluegrass","scientificName":"Polypogon fugax","batch":3,"order":146,"summary":"Asia minor bluegrass is a small annual grass that may grow upright or bend near the ground, sometimes rooting at its lower joints. Its flowering head is a dense, narrow cluster whose tiny spikelets carry short, fine bristles, giving it a softer outline than strongly bristly relatives. Rough leaf surfaces and the compact seed head are useful features to examine when separating it from other short grasses.","reviewedAt":"2026-10-09","sources":[{"label":"Kew Plants of the World Online: Polypogon fugax","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:418681-1/general-information"}]},{"id":"aedes-japonicus","commonName":"Asian bush mosquito","scientificName":"Aedes japonicus","batch":3,"order":147,"summary":"Asian bush mosquito has golden stripes across its upper body and contrasting pale bands on dark legs. Its larvae develop in small pools held by tree holes, rocks, discarded tires, and other containers, and can remain active in cooler conditions than many related mosquitoes. Adults feed on plant sugars, while females also take blood meals, making this container-breeding species relevant around homes as well as woodland edges.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Asian Bush Mosquito","url":"https://ask.ifas.ufl.edu/publication/IN1307"}]},{"id":"dryocosmus-kuriphilus","commonName":"Asian Chestnut Gall Wasp","scientificName":"Dryocosmus kuriphilus","batch":3,"order":148,"summary":"Asian chestnut gall wasp is usually noticed through the rounded green or pink swellings it produces on chestnut buds, leaves, and young shoots. Tiny larvae shelter inside these galls, which later dry into brown, woody structures that can remain on the tree. Females reproduce without mating, and repeated gall formation can disrupt shoot growth and flowering, reducing tree vigor and the production of chestnuts.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Asian Chestnut Gall Wasp","url":"https://ask.ifas.ufl.edu/publication/IN1222"}]},{"id":"diaphorina-citri","commonName":"Asian citrus psyllid","scientificName":"Diaphorina citri","batch":3,"order":149,"summary":"Asian citrus psyllid is a tiny mottled brown insect that feeds with its rear end tilted upward, almost like a thorn projecting from a citrus leaf. Its yellowish young gather on tender new growth and produce conspicuous curly tubes of white wax. Feeding can distort shoots, but its greater significance is its ability to spread bacteria associated with huanglongbing, also called citrus greening, a destructive disease of citrus trees.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Asian Citrus Psyllid and Huanglongbing Disease","url":"https://ipm.ucanr.edu/home-and-landscape/asian-citrus-psyllid-and-huanglongbing-disease/"}]},{"id":"blattella-asahinai","commonName":"Asian cockroach","scientificName":"Blattella asahinai","batch":3,"order":150,"summary":"Asian cockroach closely resembles the familiar German cockroach, but has longer wings and is a strong flier. It primarily lives outdoors in shaded mulch, compost, and accumulated plant litter, becoming active around sundown and flying toward brightly lit areas. Adults may enter buildings through doors or windows, although indoor infestations are uncommon; recognizing its outdoor habits helps explain why one might suddenly appear near a light.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Asian Cockroach","url":"https://ask.ifas.ufl.edu/publication/IN277/pdf"}]},{"id":"acalypha-australis","commonName":"Asian copperleaf","scientificName":"Acalypha australis","batch":4,"order":151,"summary":"Asian copperleaf is an upright annual with toothed, egg-shaped leaves that may show coppery or reddish new growth. Its small flowers sit inside broad, heart-shaped bracts, a useful distinction from several similar native copperleaf species. It grows in gardens, landscaped ground, and crop fields, and can be difficult to identify confidently before flowering, so the bracts deserve a closer look.","reviewedAt":"2026-10-09","sources":[{"label":"Iowa State University Extension: Asian copperleaf","url":"https://crops.extension.iastate.edu/encyclopedia/asian-copperleaf"}]},{"id":"ocinebrellus-inornatus","commonName":"Asian drill snail","scientificName":"Ocinebrellus inornatus","batch":4,"order":152,"summary":"Asian drill snail is a small marine predator that lives among gravel, mud, and shells, often in shallow oyster beds. Also called the Japanese oyster drill, it eats oysters and other shelled animals, including mussels, clams, and barnacles. Oyster transfers have carried it beyond its northwest Pacific home, making this inconspicuous snail important to both shellfish growers and people restoring native oyster habitat.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Ocinebrellus inornatus","url":"https://invasions.si.edu/nemesis/species_summary/73246"}]},{"id":"cyperus-microiria","commonName":"Asian flatsedge","scientificName":"Cyperus microiria","batch":4,"order":153,"summary":"Asian flatsedge is a tufted annual sedge with three-sided stems and narrow leaves folded into a shallow V. Its spreading flower clusters contain slender spikelets with brown to golden scales and green centers. It grows on disturbed ground and muddy river or ditch margins; looking closely at those small spikelets is more useful for identification than treating every grasslike plant at a wet edge as a grass.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of North America: Cyperus microiria","url":"https://www.efloras.org/florataxon.aspx?flora_id=1&taxon_id=200026699"},{"label":"University of Trieste: Cyperus microiria","url":"https://dryades.units.it/dolomitibellunesi/index.php?id=8092&procedure=taxon_page"}]},{"id":"undaria-pinnatifida","commonName":"Asian kelp","scientificName":"Undaria pinnatifida","batch":4,"order":154,"summary":"Asian kelp, also known as wakame, is a large brown seaweed with a distinct central rib and, when mature, a ruffled reproductive structure near the base. It can attach to natural surfaces as well as boat hulls, ropes, and other marine equipment. Fast growth and broad blades let dense stands shade smaller algae, while its resemblance to native kelps makes careful identification worthwhile.","reviewedAt":"2026-10-09","sources":[{"label":"Rhode Island Coastal Resources Management Council: Asian kelp identification card","url":"https://www.crmc.ri.gov/invasives/invasives_refcards/U_pinnatifida.pdf"}]},{"id":"asian-longhorned-beetle","commonName":"Asian Longhorned Beetle","scientificName":"Anoplophora glabripennis","batch":4,"order":155,"summary":"Asian longhorned beetle attacks maples and other hardwood trees, spending its immature life tunneling inside the wood. Round exit holes and coarse, sawdust-like material around a trunk or branch are useful signs to notice. The hidden feeding damage can weaken limbs even while a tree still looks healthy, which is why an unusual beetle or fresh holes in a familiar shade tree deserve attention.","reviewedAt":"2026-10-09","sources":[{"label":"USDA APHIS: Asian longhorned beetle","url":"https://www.aphis.usda.gov/plant-pests-diseases/alb"}]},{"id":"assiminea-parasitologica","commonName":"Asian marsh snail","scientificName":"Assiminea parasitologica","batch":4,"order":156,"summary":"Asian marsh snail is a tiny brown snail, about five millimeters tall, with a rounded cone-shaped shell. It lives high in salt and brackish tidal marshes rather than in the deeper water many people associate with marine snails. Smithsonian researchers describe introduced Oregon populations but no observed ecological impacts there; possible competition with native marsh animals remains a concern to investigate, rather than an established outcome.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Assiminea parasitologica","url":"https://invasions.si.edu/nemesis/species_summary/-456/1000"}]},{"id":"limnophila-sessiliflora","commonName":"Asian marshweed","scientificName":"Limnophila sessiliflora","batch":4,"order":157,"summary":"Asian marshweed changes its appearance at the waterline: submerged leaves are finely divided and feathery, while the leaves above water are firmer and toothed. Small pink, violet, or bluish flowers appear on exposed stems. This fast-growing aquatic perennial can regrow from fragments and form thick stands through the water column, shading other plants and interfering with canals or recreation where it becomes abundant.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Limnophila sessiliflora","url":"https://plant-directory.ifas.ufl.edu/plant-directory/limnophila-sessiliflora/"}]},{"id":"brassica-tournefortii","commonName":"Asian mustard","scientificName":"Brassica tournefortii","batch":4,"order":158,"summary":"Asian mustard, often called Sahara mustard, is a winter annual that can finish its life cycle within a few months. It grows in disturbed places but also enters desert dunes, washes, shrublands, and other open habitats. Its spread through parts of southwestern North America shows why a seasonal mustard patch can matter beyond a roadside: this species is capable of moving into natural vegetation as well.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Sahara mustard","url":"https://ipm.ucanr.edu/natural-area-pests/sahara-mustard/"}]},{"id":"colubrina-asiatica","commonName":"Asian nakedwood","scientificName":"Colubrina asiatica","batch":4,"order":159,"summary":"Asian nakedwood, also called latherleaf, is a scrambling evergreen shrub whose long branches climb through surrounding vegetation. Look for shiny, broadly oval leaves with toothed edges, small greenish flowers, and rounded, capsule-like fruits. Its climbing branches can reach roughly thirty feet, so a plant that begins as a low shrub can become a substantial tangle among neighboring plants in warm coastal landscapes.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Colubrina asiatica","url":"https://plant-directory.ifas.ufl.edu/plant-directory/colubrina-asiatica/"}]},{"id":"pachycondyla-chinensis","commonName":"Asian needle ant","scientificName":"Pachycondyla chinensis","batch":4,"order":160,"summary":"Asian needle ant is a slender, dark ant with lighter legs and mouthparts, often nesting in damp leaf litter, rotting logs, or beneath stones. It feeds on termites and other small animals and can occupy forests as well as yards and buildings. Its sting and its ability to displace native ants make it worth recognizing; newer references usually call it Brachyponera chinensis.","reviewedAt":"2026-10-09","sources":[{"label":"North Carolina State Extension: Asian needle ant","url":"https://entomology.ces.ncsu.edu/asian-needle-ant/"},{"label":"Virginia Tech Extension: Asian needle ant","url":"https://www.pubs.ext.vt.edu/content/dam/pubs_ext_vt_edu/ENTO/ENTO-29/ENTO-554.pdf"}]},{"id":"clitoria-ternatea","commonName":"Asian pigeonwings","scientificName":"Clitoria ternatea","batch":4,"order":161,"summary":"Asian pigeonwings, more often called butterfly pea, is a twining vine with large blue to violet flowers that stand out against its green foliage. The flowers give way to flattened seedpods, revealing its membership in the pea family. It grows as a perennial in warm climates and is often cultivated elsewhere as an annual, so climate and growing conditions help explain whether it persists outdoors.","reviewedAt":"2026-10-09","sources":[{"label":"North Carolina State Extension Plant Toolbox: Clitoria ternatea","url":"https://plants.ces.ncsu.edu/plants/clitoria-ternatea/"}]},{"id":"dichondra-micrantha","commonName":"Asian ponysfoot","scientificName":"Dichondra micrantha","batch":4,"order":162,"summary":"Asian ponysfoot is a low, spreading plant associated with lawns and other closely trimmed ground. Its small flowers are easily overlooked, while the nearly hairless foliage helps distinguish it from some related dichondras. It has been planted as a lawn substitute in warm places; because similar species and misapplied names complicate identification, an unfamiliar patch is best examined beyond its overall carpetlike appearance.","reviewedAt":"2026-10-09","sources":[{"label":"New Zealand Plant Conservation Network: Dichondra micrantha, drawing on Flora of New Zealand","url":"https://www.nzpcn.org.nz/flora/species/dichondra-micrantha/"}]},{"id":"hemigrapsus-sanguineus","commonName":"Asian shore crab","scientificName":"Hemigrapsus sanguineus","batch":4,"order":163,"summary":"Asian shore crab is a small crab with a roughly square shell and three teeth along each front side. It often shelters among rocks in the intertidal zone, where the shore is alternately covered and exposed by tides. A flexible diet and competition with other shore animals have helped it change some invaded Atlantic coastal communities, making rocky shoreline surveys particularly useful for tracking it.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Hemigrapsus sanguineus","url":"https://invasions.si.edu/nemesis/species_summary/-2"}]},{"id":"phakopsora-pachyrhizi","commonName":"Asian Soybean Rust","scientificName":"Phakopsora pachyrhizi","batch":4,"order":164,"summary":"Asian soybean rust is a fungal disease whose spores can travel on the wind between susceptible plants. The fungus needs living host tissue and can also persist on kudzu, linking a familiar vine with crop disease monitoring. Heavy infection reduces a soybean plant's ability to fill pods and seeds, so finding rust is about understanding the condition of a crop as well as identifying a leaf symptom.","reviewedAt":"2026-10-09","sources":[{"label":"North Carolina State Extension: Asian soybean rust","url":"https://content.ces.ncsu.edu/asian-soybean-rust"}]},{"id":"arivela-viscosa","commonName":"Asian spiderflower","scientificName":"Arivela viscosa","batch":4,"order":165,"summary":"Asian spiderflower is an annual herb with sticky hairs, yellow flowers, and leaves usually divided into five narrow leaflets. Long, slender seed capsules follow the flowers, giving the plant another useful identifying feature. Often listed as Cleome viscosa in botanical references, it can be encountered in disturbed places; checking the leaflets and capsules helps connect those different names to the same plant.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Sydney PlantNET: Arivela viscosa","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Arivela~viscosa&page=nswfl"},{"label":"Flora of North America: Arivela viscosa","url":"https://www.efloras.org/florataxon.aspx?flora_id=1&taxon_id=250055272"}]},{"id":"monopterus-albus","commonName":"Asian Swamp Eel","scientificName":"Monopterus albus","batch":4,"order":166,"summary":"Asian swamp eel is an elongated freshwater fish that often hides in soft sediment or narrow crevices and feeds at night. Its diet can include small fish, crayfish, insects, and other aquatic animals. The name Monopterus albus has been applied to a complex of closely related populations, so identification matters when interpreting records or studying how these predators affect an invaded wetland.","reviewedAt":"2026-10-09","sources":[{"label":"USGS Nonindigenous Aquatic Species: Asian swamp eel","url":"https://nas.er.usgs.gov/queries/factsheet.aspx?SpeciesID=974"},{"label":"U.S. Fish and Wildlife Service: Asian swamp eel risk summary","url":"https://www.fws.gov/sites/default/files/documents/Ecological-Risk-Screening-Summary-Asian-Swamp-Eel.pdf"}]},{"id":"nephrolepis-brownii","commonName":"Asian swordfern","scientificName":"Nephrolepis brownii","batch":4,"order":167,"summary":"Asian swordfern has tall fronds lined with overlapping leaflets whose tips are relatively blunt. Dark brown scales at the base of the fronds help distinguish it from similar native swordferns. It grows densely in shaded, well-drained places and disperses by windborne spores; where it forms thick stands, it can cover other plants and limit the growth of native vegetation underneath.","reviewedAt":"2026-10-09","sources":[{"label":"University of South Florida: Florida Invasive Plants, Nephrolepis brownii","url":"https://plantatlas.usf.edu/flip/plant.aspx?id=51"}]},{"id":"schyzocotyle-acheilognathi","commonName":"Asian tapeworm","scientificName":"Schyzocotyle acheilognathi","batch":4,"order":168,"summary":"Asian tapeworm is a parasite of freshwater fish, particularly members of the carp and minnow family. Infected fish can carry it to new waters, including through the movement of baitfish. The worm competes for nutrients inside its host and can impair growth, with young fish especially vulnerable, so a small, hidden parasite can matter to both fish conservation and the movement of live fish.","reviewedAt":"2026-10-09","sources":[{"label":"USGS: Asian fish tapeworm detection study","url":"https://www.usgs.gov/publications/loop-mediated-isothermal-amplification-lamp-assay-detection-asian-fish-tapeworm"},{"label":"USGS Nonindigenous Aquatic Species: Asian tapeworm","url":"https://nas.er.usgs.gov/queries/FactSheet.aspx?SpeciesID=2798"}]},{"id":"aedes-albopictus","commonName":"Asian Tiger Mosquito","scientificName":"Aedes albopictus","batch":4,"order":169,"summary":"Asian tiger mosquito is a daytime biter often active in the early morning and late afternoon. It breeds in small water-holding containers, including discarded tires, flowerpots, and buckets, which can bring its life cycle close to homes. The international movement of used tires helped transport this mosquito beyond Asia, illustrating how a little trapped water can carry an organism a very long way.","reviewedAt":"2026-10-09","sources":[{"label":"University of Florida IFAS: Asian tiger mosquito","url":"https://ask.ifas.ufl.edu/publication/IN594"}]},{"id":"penaeus-monodon","commonName":"Asian Tiger Shrimp","scientificName":"Penaeus monodon","batch":4,"order":170,"summary":"Asian tiger shrimp is a large marine shrimp marked by alternating dark and pale bands across its body. Young shrimp move into estuaries, while adults return to the sea to spawn. Widely raised in aquaculture outside its Indo-Pacific home, it has escaped into other coastal waters; potential competition and disease transfer are concerns, but those possibilities should not be mistaken for proven impacts everywhere it appears.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Penaeus monodon","url":"https://invasions.si.edu/nemesis/species_summary/95638"}]},{"id":"elatine-ambigua","commonName":"Asian waterwort","scientificName":"Elatine ambigua","batch":4,"order":171,"summary":"Asian waterwort is a tiny, creeping aquatic herb that forms patches on wet mud in places such as river margins and rice fields. Its small leaves and flowers make it easy to miss, and it closely resembles other waterworts. Flower stalks that bend backward in fruit are a useful clue, although submerged plants can be difficult to separate reliably from the similar Elatine triandra.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of North America: Elatine ambigua","url":"https://efloras.org/florataxon.aspx?flora_id=1&taxon_id=200014277"},{"label":"Indian Institute of Science Herbarium JCB: Elatine ambigua","url":"https://indiaflora-ces.iisc.ac.in/FloraPeninsular/herbsheet.php?cat=7&id=3567"},{"label":"Rosman and colleagues (2016): New records of Elatine ambigua","url":"https://www.researchgate.net/publication/303980729_New_Records_of_Elatine_ambigua_Elatinaceae_a_Nonindigenous_North_American_Species"}]},{"id":"corbicula-fluminea","commonName":"Asiatic Clam","scientificName":"Corbicula fluminea","batch":4,"order":172,"summary":"Asiatic clam is a small, sturdy bivalve with conspicuous concentric ridges across its rounded to triangular shell. It draws water through its body and filters suspended food, making dense populations an active part of a waterway's food web. Shell color varies, and scientists are still resolving species boundaries within Corbicula, so records filed under this familiar name may cover more diversity than the label suggests.","reviewedAt":"2026-10-09","sources":[{"label":"Missouri Department of Conservation: Asian clam","url":"https://mdc.mo.gov/discover-nature/field-guide/asian-clam"},{"label":"USGS Nonindigenous Aquatic Species: Corbicula fluminea","url":"https://nas.er.usgs.gov/queries/factsheet.aspx?SpeciesID=92"}]},{"id":"commelina-communis","commonName":"Asiatic Dayflower","scientificName":"Commelina communis","batch":4,"order":173,"summary":"Asiatic dayflower is easiest to notice when its two large blue petals open above a much smaller white petal. Each flower is short-lived, but the smooth, narrow leaves provide another clue: they wrap around the stem in a sheath rather than attaching by a leaf stalk. Those leaves can make a nonflowering plant resemble smartweed at a glance, so the brief blue bloom is especially helpful.","reviewedAt":"2026-10-09","sources":[{"label":"Iowa State University Extension: Asiatic dayflower","url":"https://crops.extension.iastate.edu/encyclopedia/asiatic-dayflower"}]},{"id":"rumex-confertus","commonName":"Asiatic dock","scientificName":"Rumex confertus","batch":4,"order":174,"summary":"Asiatic dock grows from a basal cluster of large leaves and sends upright stems above them. It can spread both by seed and by vegetative growth, and occurs in habitats including grassland, river margins, and disturbed ground. Dense patches may shade neighboring vegetation, although their formation depends on local conditions; its size and expanding leaf clusters are more useful to notice than assuming every dock behaves alike.","reviewedAt":"2026-10-09","sources":[{"label":"USDA APHIS: Weed risk assessment for Rumex confertus","url":"https://www.aphis.usda.gov/media/document/34054/file"}]},{"id":"maladera-formosae","commonName":"Asiatic garden beetle","scientificName":"Maladera formosae","batch":4,"order":175,"summary":"Asiatic garden beetle is a small cinnamon-brown scarab, roughly the size and shape of a coffee bean. Adults feed on many garden and crop plants at night, while their pale grubs live underground and eat roots. This split life cycle explains why foliage damage and root injury may have the same cause, even when the beetles are hard to find during the day.","reviewedAt":"2026-10-09","sources":[{"label":"University of Maine Extension: Asiatic garden beetle","url":"https://extension.umaine.edu/home-and-garden-ipm/fact-sheets/common-name-listing/asiatic-garden-beetle/"}]},{"id":"striga-asiatica","commonName":"Asiatic witchweed","scientificName":"Striga asiatica","batch":4,"order":176,"summary":"Asiatic witchweed is a small, stiff-stemmed flowering plant with coarse hairs and narrow green leaves. Its modest appearance hides a damaging habit: it attaches directly to the roots of grasses, including crops such as corn, sorghum, and rice, and takes water and nutrients from them. Tiny, dustlike seeds add to its persistence and spread, making the underground relationship as important as the visible flowers.","reviewedAt":"2026-10-09","sources":[{"label":"USDA APHIS: Witchweed biology and eradication program assessment","url":"https://www.aphis.usda.gov/sites/default/files/witchweed-north-south-carolina.pdf"}]},{"id":"crioceris-asparagi","commonName":"Asparagus beetle","scientificName":"Crioceris asparagi","batch":4,"order":177,"summary":"Asparagus beetle is a small, dark beetle with pale spots, often found feeding on asparagus spears and foliage. Its elongated eggs stand in rows on the plant, and the plump grayish larvae also feed there before pupating in soil. Unlike the orange spotted asparagus beetle, this species can directly spoil the edible spears, so noticing which beetle is present helps explain the kind of damage.","reviewedAt":"2026-10-09","sources":[{"label":"University of Wisconsin Vegetable Entomology: Asparagus beetle","url":"https://vegento.russell.wisc.edu/pests/asparagus-beetle/"}]},{"id":"asparagus-densiflorus","commonName":"Asparagus fern","scientificName":"Asparagus densiflorus","batch":4,"order":178,"summary":"Asparagus fern looks soft and feathery, but it is a flowering relative of garden asparagus rather than a true fern. Its fine green foliage is mostly modified stems, while the true leaves are tiny scales; mature plants can produce small flowers and red berries. Cultivated widely in containers and warm gardens, it can spread through bird-carried seeds, so the delicate appearance conceals a durable plant.","reviewedAt":"2026-10-09","sources":[{"label":"University of Wisconsin Extension: Asparagus fern","url":"https://hort.extension.wisc.edu/articles/asparagus-fern-asparagus-densiflorus/"}]},{"id":"phyllonorycter-apparella","commonName":"Aspen leaf blotch miner","scientificName":"Phyllonorycter apparella","batch":4,"order":179,"summary":"Aspen leaf blotch miner is a tiny moth whose caterpillars live between the surfaces of aspen and cottonwood leaves. Their feeding makes blotched patches, and silk drawn across a leaf can shrink into a raised ridge over the mine. The early larvae feed on sap before eating leaf tissue, so an affected leaf records several stages of an insect's life even when the moth is never seen.","reviewedAt":"2026-10-09","sources":[{"label":"Pacific Northwest Pest Management Handbooks: Aspen leaf blotch miner","url":"https://pnwhandbooks.org/insect/hort/landscape/hosts-pests-landscape-plants/aspen-populus-tremuloides-aspen-leaf-blotch-miner"}]},{"id":"conyza-bonariensis","commonName":"Asthmaweed","scientificName":"Conyza bonariensis","batch":4,"order":180,"summary":"Asthmaweed, also called hairy fleabane, is a rapidly growing annual or biennial of cultivated fields and other disturbed ground. It occurs in settings from orchards and nurseries to roadsides and canal banks, where it competes with neighboring plants for water. Because it can be confused with horseweed, its scientific name is useful when comparing identification guides or discussing an unfamiliar fleabane in a field.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Hairy fleabane","url":"https://ipm.ucanr.edu/weeds-identification-gallery/hairy-fleabane/"}]},{"id":"conyza-floribunda","commonName":"Asthmaweed","scientificName":"Conyza floribunda","batch":4,"order":181,"summary":"This asthmaweed is an upright herb with narrow leaves and many small flower heads on branches concentrated toward the top. The tiny fruits carry white bristles, and flowering typically extends from summer into fall in the Flora of North America account. It grows in disturbed places, but its tangled naming history makes careful identification worthwhile: botanical references have treated it differently from other closely related fleabanes.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of North America: Conyza floribunda","url":"https://efloras.org/florataxon.aspx?flora_id=1&taxon_id=242421539"},{"label":"USDA GRIN: Conyza floribunda taxonomy","url":"https://npgsweb.ars-grin.gov/gringlobal/taxon/taxonomydetail?id=450910"},{"label":"Singhurst and Holmes (2013): Conyza floribunda in Texas","url":"https://www.phytoneuron.net/2013Phytoneuron/13PhytoN-Conyzafloribunda.pdf"}]},{"id":"tamarix-aphylla","commonName":"Athel tamarisk","scientificName":"Tamarix aphylla","batch":4,"order":182,"summary":"Athel tamarisk is an evergreen shrub or large tree whose minute leaves hug slender, jointed twigs. Clusters of tiny pink to white flowers soften its otherwise fine-textured crown. A deep taproot helps it endure dry conditions, and it tolerates saline or alkaline soils; those traits explain its use in harsh landscapes, while the twiglike foliage helps distinguish it from many ordinary shade trees.","reviewedAt":"2026-10-09","sources":[{"label":"Oregon State University Landscape Plants: Tamarix aphylla","url":"https://landscapeplants.oregonstate.edu/plants/tamarix-aphylla"}]},{"id":"hedera-hibernica","commonName":"Atlantic ivy","scientificName":"Hedera hibernica","batch":4,"order":183,"summary":"Atlantic ivy, often called Irish ivy, is an evergreen vine with waxy leaves that can form a thick groundcover and climb surrounding trees or structures. Established vines spread across the ground, and broken stem pieces can start new plants. Birds also carry seeds from the berries, helping explain how a planted ivy patch can extend into nearby woodland and cover other vegetation.","reviewedAt":"2026-10-09","sources":[{"label":"Oregon State University: Ivy","url":"https://solvepestproblems.oregonstate.edu/weeds/ivy"}]},{"id":"aleuroclava-aucubae","commonName":"Aucuba whitefly","scientificName":"Aleuroclava aucubae","batch":4,"order":184,"summary":"Aucuba whitefly feeds on a surprisingly broad range of trees and shrubs, including aucuba, ivy, citrus, mulberry, and several ornamental plants. Infested plant material can move it between places, making nursery and landscape observations useful. California's 2022 assessment found no reported plant damage or significant economic effects, so its presence should be distinguished from evidence that it is harming the plant on which it was found.","reviewedAt":"2026-10-09","sources":[{"label":"California Department of Food and Agriculture: Aleuroclava aucubae assessment","url":"https://blogs.cdfa.ca.gov/Section3162/wp-content/uploads/2022/08/Aleuroclava-aucubae.pdf"}]},{"id":"geranium-homeanum","commonName":"Australasian geranium","scientificName":"Geranium homeanum","batch":4,"order":185,"summary":"Australasian geranium is a low, sprawling herb with coarse hairs and rounded leaves divided into several lobes. Small pink to nearly white flowers usually appear in pairs, and its fleshy taproot supports growth that may last more than one season. In its Australian habitat it favors damp forest sites and rainforest margins, offering a useful habitat clue alongside the leaf shape and paired flowers.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Sydney PlantNET: Geranium homeanum","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Geranium~homeanum&page=nswfl"}]},{"id":"aedes-notoscriptus","commonName":"Australian backyard mosquito","scientificName":"Aedes notoscriptus","batch":4,"order":186,"summary":"Australian backyard mosquito is a dark mosquito with banded legs, a pale ring around its feeding tube, and fine pale markings forming a lyre shape on its back. Its larvae use natural water pockets such as tree holes as well as rain-filled tires, gutters, and plant trays. That flexibility ties its life cycle closely to the small water-holding spaces people create around homes.","reviewedAt":"2026-10-09","sources":[{"label":"Northern Territory Department of Health: Common mosquitoes, Aedes notoscriptus","url":"https://digitallibrary.health.nt.gov.au/bitstreams/b55edef9-94d9-4ba3-b454-66967fd37f1b/download"}]},{"id":"pteris-tremula","commonName":"Australian brake","scientificName":"Pteris tremula","batch":4,"order":187,"summary":"Australian brake is a fern with finely divided fronds ending in long, narrow segments. Its spore-bearing structures run along the underside margins, protected by the rolled leaf edges. It grows in varied sheltered places, including forest margins, streambanks, and gardens, so looking underneath a frond can reveal more about its identity than the soft, feathery outline alone.","reviewedAt":"2026-10-09","sources":[{"label":"Flora of New Zealand: Pteris tremula","url":"https://nzflora.info/factsheet/Taxon/Pteris-tremula.html"}]},{"id":"pittosporum-undulatum","commonName":"Australian cheesewood","scientificName":"Pittosporum undulatum","batch":4,"order":188,"summary":"Australian cheesewood is a small tree with glossy leaves whose edges form gentle waves. Fragrant white flowers are followed by rounded yellow-orange fruits that open to expose sticky orange seeds. Birds help disperse those seeds, connecting a familiar planted tree with new seedlings nearby; the combination of wavy foliage, scented flowers, and opening fruit is especially useful when recognizing it through the seasons.","reviewedAt":"2026-10-09","sources":[{"label":"Stanford University: Pittosporum undulatum","url":"https://trees.stanford.edu/ENCYC/PITTund.htm"}]},{"id":"vallisneria-australis","commonName":"Australian eelgrass","scientificName":"Vallisneria australis","batch":4,"order":189,"summary":"Australian eelgrass, also called ribbon weed, grows underwater with long, strap-shaped leaves rising from the sediment. Runners connect neighboring plants into tall aquatic meadows, while small female flowers reach the surface on slender stalks. After pollination, those stalks coil back underwater, a distinctive feature of its life cycle; despite the common name, this is a freshwater plant rather than a marine seagrass.","reviewedAt":"2026-10-09","sources":[{"label":"California Department of Parks and Recreation: Ribbon weed identification","url":"https://nrm.dfg.ca.gov/FileHandler.ashx?DocumentID=193687&inline="}]},{"id":"chloris-truncata","commonName":"Australian fingergrass","scientificName":"Chloris truncata","batch":4,"order":190,"summary":"Australian fingergrass is also called windmill grass, a fitting name for the long flower spikes radiating from the top of each stem. It is a low, clumping perennial with relatively narrow leaves, and the small florets darken as they mature. Often associated with grassland on heavy soils in its native region, its wheel-shaped seed heads make it easier to recognize than many grasses before flowering.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Sydney PlantNET: Chloris truncata","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Chloris~truncata&page=nswfl"},{"label":"University of Sydney eFlora: Chloris truncata","url":"https://eflora.sydney.edu.au/taxon/chloris-truncata"}]},{"id":"eragrostis-leptostachya","commonName":"Australian lovegrass","scientificName":"Eragrostis leptostachya","batch":4,"order":191,"summary":"Australian lovegrass is a slender, tufted perennial with narrow leaves and an open, branching flower head above the foliage. Its small spikelets hold several tightly arranged florets, giving them a finely segmented appearance. Native to eastern and southeastern Australia, it is also known as paddock lovegrass; examining the flower head and the tiny hairs where leaf meets stem helps distinguish it from other similar grasses.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Kew GrassBase: Eragrostis leptostachya","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:401241-1/general-information"}]},{"id":"toona-ciliata","commonName":"Australian redcedar","scientificName":"Toona ciliata","batch":4,"order":192,"summary":"Australian redcedar is a large deciduous rainforest tree with long compound leaves and a broad, spreading crown. Small pale flowers give way to capsules that split open and release winged seeds. Its soft, workable timber made it historically valuable, while prolific seed production can support spread beyond planted trees, so young seedlings deserve as much attention as the impressive mature canopy.","reviewedAt":"2026-10-09","sources":[{"label":"Botanic Gardens of Sydney: Australian red cedar","url":"https://www.botanicgardens.org.au/our-science/our-collections/plant-names-and-classifications/palms"}]},{"id":"cherax-quadricarinatus","commonName":"Australian redclaw crayfish","scientificName":"Cherax quadricarinatus","batch":4,"order":193,"summary":"Australian redclaw crayfish is a large freshwater crayfish, often blue-green, with a bright red patch along the outer claw of mature males. It eats a mixture of plant and animal material and is raised commercially in ponds. Its movement through aquaculture has taken it beyond its native range, making escaped or released animals relevant to the ecology of receiving waterways.","reviewedAt":"2026-10-09","sources":[{"label":"USGS Nonindigenous Aquatic Species: Australian redclaw crayfish","url":"https://nas.er.usgs.gov/queries/factsheet.aspx?SpeciesID=220"},{"label":"Joyce and colleagues (2016), James Cook University: Redclaw feeding study","url":"https://researchonline.jcu.edu.au/43044/6/43044%20Joyce%20et%20al%202016.pdf"}]},{"id":"atriplex-semibaccata","commonName":"Australian saltbush","scientificName":"Atriplex semibaccata","batch":4,"order":194,"summary":"Australian saltbush is a low, spreading perennial with gray-green leaves that often look dusted or mealy underneath. Small flowers sit in the leaf axils, followed by reddish to mauve structures surrounding the seeds. It can grow on saline soils, dry rocky slopes, and disturbed ground, so its low profile may hide a plant well suited to difficult sites where other vegetation struggles.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Kew: Atriplex semibaccata, Flora of Iraq and Flora of Tropical East Africa","url":"https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:164141-1/general-information"}]},{"id":"leptospermum-laevigatum","commonName":"Australian teatree","scientificName":"Leptospermum laevigatum","batch":4,"order":195,"summary":"Australian teatree is a shrub or small tree with gray-green leaves, white flowers, and woody seed capsules with flat tops. Older trunks can become strikingly twisted beneath shaggy, fibrous bark, making mature plants quite different in appearance from a clipped hedge. Newer botanical treatments may call it Gaudium laevigatum, so that name can help connect nursery labels and identification references.","reviewedAt":"2026-10-09","sources":[{"label":"Stanford University: Australian tea tree","url":"https://trees.stanford.edu/ENCYC/LEPTOlaev.htm"}]},{"id":"trachymela-sloanei","commonName":"Australian tortoise beetle","scientificName":"Trachymela sloanei","batch":4,"order":196,"summary":"Australian tortoise beetle is a eucalyptus leaf feeder whose adults and larvae can leave conspicuous notches along leaf edges. The insects often hide on or beneath bark during the day, so the tattered foliage may be easier to spot than its cause. Well-established eucalyptus can tolerate substantial feeding, which makes the condition of the whole tree more informative than a damaged leaf alone.","reviewedAt":"2026-10-09","sources":[{"label":"University of California IPM: Eucalyptus tortoise beetles","url":"https://ipm.ucanr.edu/home-and-landscape/eucalyptus-tortoise-beetles/"}]},{"id":"ficopomatus-enigmaticus","commonName":"Australian tubeworm","scientificName":"Ficopomatus enigmaticus","batch":4,"order":197,"summary":"Australian tubeworm lives inside a hard, pale tube and extends a feathery crown into the water to collect food. In sheltered brackish waters, many individuals can build reeflike masses on hard surfaces or over sediment, changing habitat and fouling boats or waterfront structures. Despite its common name, its original geographic home remains uncertain, and large reef formation does not occur everywhere it is found.","reviewedAt":"2026-10-09","sources":[{"label":"Smithsonian NEMESIS: Ficopomatus enigmaticus","url":"https://invasions.si.edu/nemesis/species_summary/68350"},{"label":"Smithsonian NEMESIS California: Ficopomatus enigmaticus ecology","url":"https://invasions.si.edu/nemesis/calnemo/species_summary/68350"}]},{"id":"cotula-australis","commonName":"Australian waterbuttons","scientificName":"Cotula australis","batch":4,"order":198,"summary":"Australian waterbuttons is a small, low-growing herb with finely divided leaves and tiny buttonlike flower heads on slender stalks. The pale yellow or cream flowers lack the showy outer petals of many daisies, so the heads can seem surprisingly plain. It grows in open grassy places and can appear in roadsides and lawns, where its divided foliage is a useful clue before the little flower stalks rise.","reviewedAt":"2026-10-09","sources":[{"label":"Royal Botanic Gardens Sydney PlantNET: Cotula australis","url":"https://plantnet.rbgsyd.nsw.gov.au/cgi-bin/NSWfl.pl?lvl=sp&name=Cotula~australis&page=nswfl"}]},{"id":"pinus-nigra","commonName":"Austrian pine","scientificName":"Pinus nigra","batch":4,"order":199,"summary":"Austrian pine is a substantial evergreen with stiff, dark green needles held in pairs and dark, furrowed bark. Young trees tend to be pyramidal, while older crowns become rounded and spreading. Long planted as a screen or windbreak, it tolerates varied soils and some drought once established; paired needles and outward-pointing brown cones offer practical clues when comparing it with other landscape pines.","reviewedAt":"2026-10-09","sources":[{"label":"North Carolina State Extension Plant Toolbox: Pinus nigra","url":"https://plants.ces.ncsu.edu/plants/pinus-nigra/"}]},{"id":"rorippa-austriaca","commonName":"Austrian yellowcress","scientificName":"Rorippa austriaca","batch":4,"order":200,"summary":"Austrian yellowcress is an upright perennial with toothed leaves that partly clasp the stem and clusters of small yellow flowers. Its nearly round fruits help distinguish it from mustards with long, narrow seedpods. It grows along periodically flooded riverbanks and other moist, disturbed places, and can spread through underground runners, so a patch may expand even when few well-developed seeds are visible.","reviewedAt":"2026-10-09","sources":[{"label":"Burgenland Flora: Rorippa austriaca","url":"https://www.burgenlandflora.at/flora/detail/rorippa-austriaca/"}]}];let batch=0;const main=document.querySelector('#profiles'),search=document.querySelector('#search');function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function render(){const q=search.value.toLowerCase().trim();const rows=data.filter(r=>(!batch||r.batch===batch)&&(!q||(r.commonName+' '+r.scientificName).toLowerCase().includes(q)));main.replaceChildren();document.querySelector('#count').textContent=rows.length+' profiles shown';for(const r of rows){const a=el('article','');a.id=r.id;a.append(el('small','#'+r.order+' / Batch '+r.batch),el('h2',r.commonName));const sci=el('p',r.scientificName);sci.className='latin';a.append(sci,el('p',r.summary));const ul=el('ul','');for(const s of r.sources){const li=el('li',''),link=el('a',s.label);link.href=s.url;link.target='_blank';link.rel='noopener noreferrer';li.append(link);ul.append(li)}a.append(ul);main.append(a)}}document.querySelectorAll('[data-batch]').forEach(b=>b.addEventListener('click',()=>{batch=Number(b.dataset.batch);document.querySelectorAll('[data-batch]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));search.addEventListener('input',render);render();
</script></html>
