name: Round 69 Linux prebuild

on:
  workflow_dispatch:
  push:
    branches:
      - codex/round69-linux-prebuild

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact production candidate
        uses: actions/checkout@v4
        with:
          ref: b360212653852b6964a3a43060a7930229016617

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link the public Vercel project metadata
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_5NDBkWKjBSUFFMAo0CaKT1m3","projectId":"prj_8QxSuEepVs46XFag4IJM5QcOLPdg","projectName":"projectisitusa","settings":{"createdAt":1776327832610,"framework":"nextjs","devCommand":null,"installCommand":null,"buildCommand":null,"outputDirectory":null,"rootDirectory":null,"directoryListing":false,"nodeVersion":"24.x","analyticsId":null}}' > .vercel/project.json

      - name: Build the production artifact
        run: npx --yes vercel@58.8.0 build --prod --yes --standalone

      - name: Preserve Linux file semantics
        shell: bash
        run: tar -C .vercel -czf vercel-output.tgz output

      - name: Upload the prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: round69-vercel-output-b36021265
          path: vercel-output.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
